/* ════════════════ MÓDULO 5 — FORÇAS DE STARLING ════════════════ */
const STARLING_PRESETS = {
  normal: { label: "Normal", Pa: 35, Pv: 15, Pi: 0, pic: 25, pii: 3, sigma: 0.9, Kf: 1 },
  cirrose: { label: "Cirrose / hipoalbuminemia", Pa: 35, Pv: 15, Pi: 0, pic: 14, pii: 3, sigma: 0.9, Kf: 1 },
  ic: { label: "Insuficiência cardíaca", Pa: 42, Pv: 28, Pi: 0, pic: 25, pii: 3, sigma: 0.9, Kf: 1 },
  inflam: { label: "Inflamação", Pa: 37, Pv: 17, Pi: 0, pic: 25, pii: 8, sigma: 0.5, Kf: 3 },
};
defModule({
  id: "starling", num: 5, title: "Forças de Starling", short: "Starling",
  achievement: "Equação de Starling interpretada",
  params: () => [
    { key: "preset", label: "Cenário", options: Object.entries(STARLING_PRESETS).map(([k, v]) => [k, v.label]), value: "normal" },
    { key: "Pa", label: "Pc na ponta arteriolar", min: 10, max: 60, step: 1, value: 35, unit: "mmHg", dec: 0 },
    { key: "Pv", label: "Pc na ponta venular", min: 5, max: 45, step: 1, value: 15, unit: "mmHg", dec: 0 },
    { key: "Pi", label: "Pi (intersticial)", min: -5, max: 10, step: 1, value: 0, unit: "mmHg", dec: 0 },
    { key: "pic", label: "πc (oncótica plasmática)", min: 5, max: 35, step: 1, value: 25, unit: "mmHg", dec: 0 },
    { key: "pii", label: "πi (oncótica intersticial)", min: 0, max: 15, step: 1, value: 3, unit: "mmHg", dec: 0 },
    { key: "sigma", label: "σ (reflexão das proteínas)", min: 0, max: 1, step: 0.05, value: 0.9, unit: "", dec: 2 },
    { key: "Kf", label: "Kf (condutância relativa)", min: 0.2, max: 4, step: 0.1, value: 1, unit: "×", dec: 1 },
  ],
  onParam(S, k) { if (k === "preset") Object.assign(S.p, STARLING_PRESETS[S.p.preset]); },
  calc(S) {
    const n = 40, pts = [];
    let sum = 0;
    for (let i = 0; i <= n; i++) {
      const x = i / n, Pc = lerp(S.p.Pa, S.p.Pv, x);
      const r = Phys.starling({ Pc, Pi: S.p.Pi, pic: S.p.pic, pii: S.p.pii, sigma: S.p.sigma, Kf: S.p.Kf });
      pts.push([x, Pc, r.nfp]); sum += r.nfp;
    }
    const nfp = sum / (n + 1), Jv = S.p.Kf * nfp, lymph = 7;
    return { pts, nfp, Jv, lymph, edema: Jv > lymph };
  },
  init(S) { S.flow = 0; S.edemaV = 0; },
  step(S, dt) { const r = this.calc(S); S.flow += dt; S.edemaV = clamp(S.edemaV + (r.edema ? dt * 0.08 * (r.Jv - r.lymph) : -dt * 0.15), 0, 1); },
  draw(S, ctx, w, hh) {
    const c = Theme.c, r = this.calc(S);
    ctx.fillStyle = c.ecf; ctx.fillRect(0, 0, w, hh);
    if (S.edemaV > 0) { ctx.fillStyle = c.s1; ctx.globalAlpha = 0.15 * S.edemaV; ctx.fillRect(0, 0, w, hh); ctx.globalAlpha = 1; }
    const y0 = hh / 2 - 34, y1 = hh / 2 + 34, x0 = 50, x1 = w - 50;
    Draw.rrect(ctx, x0, y0, x1 - x0, y1 - y0, 34, c.icf, c.s4);
    for (let k = 0; k < 18; k++) { const x = x0 + 20 + ((S.flow * 60 + k * 47) % (x1 - x0 - 40)); Draw.dot(ctx, x, hh / 2 + Math.sin(k) * 14, 8, "#c0392b"); }
    for (let i = 0; i < r.pts.length; i += 5) {
      const [x, , nfp] = r.pts[i], px = x0 + 25 + x * (x1 - x0 - 50), len = clamp(Math.abs(nfp) * 3.2, 0, 70) * S.p.Kf ** 0.5;
      if (len < 4) continue;
      const out = nfp > 0;
      for (const s of [-1, 1]) {
        const yb = s < 0 ? y0 : y1;
        out ? Draw.arrow(ctx, px, yb, px, yb + s * len, c.s2, 3) : Draw.arrow(ctx, px, yb + s * len, px, yb, c.s3, 3);
      }
    }
    Draw.text(ctx, "arteríola", x0, y1 + 90, { size: 13, color: c.muted }); Draw.text(ctx, "vênula", x1, y1 + 90, { size: 13, color: c.muted, align: "right" });
    Draw.text(ctx, "↑↓ laranja = filtração (sai do capilar) · verde = reabsorção", w / 2, 22, { align: "center", size: 13, color: c.ink });
    Draw.text(ctx, r.edema ? "Filtração supera a drenagem linfática → EDEMA" : "Filtração líquida drenada pela linfa", w / 2, hh - 12, { align: "center", size: 14, weight: 700, color: r.edema ? c.bad : c.good });
  },
  liveCharts: false,
  chartTitles: () => ["Pressões ao longo do capilar", "Filtração líquida × drenagem linfática"],
  charts(S, [a, b]) {
    const r = this.calc(S), opp = S.p.Pi + S.p.sigma * (S.p.pic - S.p.pii);
    const pc = r.pts.map(([x, Pc]) => [x, Pc]);
    Chart.line(a, { id: "s1", series: [{ name: "Pc (empurra para fora)", color: "var(--s2)", pts: pc }, { name: "Pi + σ(πc−πi) (puxa para dentro)", color: "var(--s3)", pts: [[0, opp], [1, opp]] }],
      xlim: [0, 1], ylim: [0, 60], xlabel: "posição (0 = arteríola, 1 = vênula)", ylabel: "mmHg",
      fills: [{ pts: [...pc, [1, opp], [0, opp]], color: "var(--s2)", opacity: 0.12 }], fmtTip: (v) => fmt(v, 1) + " mmHg" });
    Chart.bars(b, { bars: [{ label: "filtração líquida Jv", value: r.Jv, color: "var(--s2)" }, { label: "capacidade linfática", value: r.lymph, color: "var(--s3)" }], ylabel: "u.a.", dec: 1 });
  },
  results(S) {
    const r = this.calc(S);
    return [{ k: "NFP média ao longo do capilar", v: fmt(r.nfp, 1) + " mmHg" }, { k: "Jv = Kf·NFP (u.a.)", v: fmt(r.Jv, 1), hl: true },
      { k: "NFP na arteríola", v: fmt(r.pts[0][2], 1) + " mmHg" }, { k: "NFP na vênula", v: fmt(r.pts[r.pts.length - 1][2], 1) + " mmHg" },
      { k: "Situação", v: r.edema ? "edema" : "equilibrada pela linfa" }];
  },
  actions(S, inst) {
    return Object.entries(STARLING_PRESETS).map(([k, v]) => ({ id: k, label: v.label, primary: S.p.preset === k, fn: () => inst.set("preset", k) }));
  },
  equation: () => "J<sub>v</sub> = K<sub>f</sub>·[(P<sub>c</sub> − P<sub>i</sub>) − σ·(π<sub>c</sub> − π<sub>i</sub>)]<small>π aqui é a pressão ONCÓTICA (proteínas), não a osmótica total</small>",
  explain(S) {
    const r = this.calc(S);
    return { que: r.edema ? "A filtração ao longo do capilar supera o que a linfa consegue drenar: acumula-se líquido no interstício." : "Há filtração na ponta arteriolar e reabsorção ou filtração menor na ponta venular; o excedente é drenado pela linfa.",
      porque: "A pressão hidrostática do sangue empurra água para fora; a pressão oncótica, sobretudo da albumina, segura água dentro do vaso. Cristaloides atravessam a parede capilar e não exercem pressão oncótica efetiva.",
      importa: "Edema por ↑Pc (insuficiência cardíaca), ↓πc (cirrose, síndrome nefrótica, desnutrição), ↑Kf/↓σ (inflamação, sepse) ou ↓ drenagem linfática." };
  },
  note: () => "modelo clássico com Pc decrescendo linearmente; valores aproximados. O modelo revisado (glicocálice endotelial) mostra que a pressão oncótica relevante é a do espaço subglicocálice e que a reabsorção venular sustentada é pequena: o retorno de líquido depende muito da linfa.",
  bets: [
    { q: "Se a albumina plasmática cair (πc de 25 para 14 mmHg), o que acontece com a filtração?", opts: ["Diminui", "Aumenta e pode haver edema", "Não muda"], correct: 1,
      apply: (S, i) => i.set("preset", "cirrose"), why: "Com menos pressão oncótica, a força que segura água no vaso cai: a filtração aumenta." },
    { q: "Na inflamação, o capilar fica mais permeável a proteínas (σ ↓, Kf ↑). Efeito?", opts: ["Mais filtração", "Menos filtração", "Nenhum"], correct: 0,
      apply: (S, i) => i.set("preset", "inflam"), why: "σ menor reduz a pressão oncótica efetiva e Kf maior amplifica o fluxo." },
  ],
  compare: [{ name: "Albumina normal × hipoalbuminemia", a: { label: "Normal", p: { ...STARLING_PRESETS.normal, preset: "normal" } }, b: { label: "Hipoalbuminemia", p: { ...STARLING_PRESETS.cirrose, preset: "cirrose" } } }],
});

/* ════════════════ MÓDULO 6 — pH E APRISIONAMENTO IÔNICO ════════════════ */
defModule({
  id: "ph", num: 6, title: "pH e aprisionamento iônico", short: "pH e ion trapping",
  achievement: "Aprisionamento iônico explicado",
  scenes: [{ id: "ionizacao", label: "Ionização" }, { id: "trapping", label: "Dois compartimentos" }, { id: "nefron", label: "Túbulo renal (salicilato)" }],
  params(S) {
    const tipo = { key: "tipo", label: "Molécula", options: [["acido", "Ácido fraco (HA ⇌ A⁻)"], ["base", "Base fraca (B ⇌ BH⁺)"]], value: "acido" };
    if (S.scene === "ionizacao") return [tipo, { key: "pKa", label: "pKa", min: 1, max: 12, step: 0.1, value: 3.5, unit: "" }, { key: "pH", label: "pH do meio", min: 0, max: 14, step: 0.1, value: 1.5, unit: "" }];
    if (S.scene === "trapping") return [tipo, { key: "pKa", label: "pKa", min: 1, max: 12, step: 0.1, value: 3.5 },
      { key: "pH1", label: "pH compartimento A (estômago)", min: 0.5, max: 9, step: 0.1, value: 1.5 }, { key: "pH2", label: "pH compartimento B (plasma)", min: 5, max: 9, step: 0.1, value: 7.4 },
      { key: "r", label: "Permeabilidade relativa da forma ionizada", min: 0, max: 0.2, step: 0.01, value: 0, dec: 2 }];
    return [{ key: "pHu", label: "pH urinário (lúmen tubular)", min: 4.5, max: 8.5, step: 0.1, value: 5.5 }, { key: "pKa", label: "pKa (ácido salicílico ≈ 3,0)", min: 1, max: 6, step: 0.1, value: 3.0 }];
  },
  init(S) {
    const r = rng(21);
    S.mols = Array.from({ length: 160 }, (_, i) => ({ side: i % 2, x: r(), y: r(), neutral: true, fly: null }));
    S.flick = 0;
  },
  sides(S) {
    if (S.scene === "nefron") return { pHA: S.p.pHu, pHB: 7.4, tipo: "acido" };
    return { pHA: S.p.pH1, pHB: S.p.pH2, tipo: S.p.tipo };
  },
  step(S, dt) {
    S.flick += dt;
    if (S.scene === "ionizacao") {
      const f = Phys.fracNeutral(S.p.pH, S.p.pKa, S.p.tipo);
      for (const m of S.mols.slice(0, 40)) { if (Math.random() < dt * 3) m.neutral = Math.random() < f; m.x = clamp(m.x + gauss() * 0.01, 0, 1); m.y = clamp(m.y + gauss() * 0.01, 0, 1); }
      return;
    }
    const { pHA, pHB, tipo } = this.sides(S), r = S.scene === "nefron" ? 0 : S.p.r;
    const fA = Phys.fracNeutral(pHA, S.p.pKa, tipo), fB = Phys.fracNeutral(pHB, S.p.pKa, tipo);
    for (const m of S.mols) {
      if (m.fly) { m.fly.t += dt / 0.3; if (m.fly.t >= 1) { m.side = 1 - m.side; m.x = m.side ? 0.3 + Math.random() * 0.5 : 0.2 + Math.random() * 0.5; m.fly = null; } continue; }
      if (Math.random() < dt * 4) m.neutral = Math.random() < (m.side ? fB : fA);
      m.x = clamp(m.x + gauss() * 0.02, 0, 1); m.y = clamp(m.y + gauss() * 0.02, 0, 1);
      const nearMem = m.side ? m.x < 0.25 : m.x > 0.75;
      // cinética acelerada para visualização; equilíbrio = balanço de fluxos (fA + r(1−fA))·[A] = (fB + r(1−fB))·[B]
      const pA = fA + r * (1 - fA), pB = fB + r * (1 - fB), mx = Math.max(pA, pB);
      const p = (m.side ? pB : pA) / mx * 9 * dt;
      if (nearMem && Math.random() < p) { m.fly = { t: 0 }; m.neutral = true; }
    }
  },
  draw(S, ctx, w, hh) {
    const c = Theme.c;
    if (S.scene === "ionizacao") {
      ctx.fillStyle = c.ecf; ctx.fillRect(0, 0, w, hh);
      const f = Phys.fracNeutral(S.p.pH, S.p.pKa, S.p.tipo), ym = hh - 60;
      Draw.membrane(ctx, 0, w, ym, 40);
      const ion = S.p.tipo === "acido" ? "A⁻" : "BH⁺", neu = S.p.tipo === "acido" ? "HA" : "B";
      S.mols.slice(0, 40).forEach((m) => {
        const x = 20 + m.x * (w - 40), y = 30 + m.y * (ym - 80) + (m.neutral ? Math.sin(S.flick * 2 + m.x * 9) * 6 : 0);
        Draw.dot(ctx, x, y, w < 600 ? 10 : 13, m.neutral ? c.s3 : c.s2, m.neutral ? neu : ion);
        if (m.neutral && m.y > 0.85) Draw.arrow(ctx, x, y + 15, x, ym - 14, c.s3, 1.5);
      });
      Draw.text(ctx, `pH ${fmt(S.p.pH, 1)} · pKa ${fmt(S.p.pKa, 1)} → ${fmt(f * 100, 1)} % não ionizada`, w / 2, 22, { align: "center", size: 16, weight: 700 });
      Draw.legend(ctx, [[c.s3, `${neu}: neutra, atravessa a bicamada`], [c.s2, `${ion}: carregada, fica retida`]], w / 2, hh - 10, w - 20);
      return;
    }
    const { pHA, pHB, tipo } = this.sides(S), mx = w / 2, mwid = 34;
    ctx.fillStyle = S.scene === "nefron" ? c.icf : c.ecf; ctx.fillRect(0, 0, mx, hh);
    ctx.fillStyle = c.ecf; ctx.fillRect(mx, 0, w - mx, hh);
    Draw.membraneV(ctx, mx, 0, hh, mwid);
    const ion = tipo === "acido" ? "A⁻" : "BH⁺", neu = tipo === "acido" ? "HA" : "B";
    for (const m of S.mols) {
      let x, y = 30 + m.y * (hh - 70);
      if (m.fly) x = m.side ? lerp(mx + mwid / 2 + 4, mx - mwid / 2 - 4, m.fly.t) : lerp(mx - mwid / 2 - 4, mx + mwid / 2 + 4, m.fly.t);
      else x = m.side ? mx + mwid / 2 + 8 + m.x * (w - mx - mwid / 2 - 16) : 8 + m.x * (mx - mwid / 2 - 16);
      Draw.dot(ctx, x, y, 6.5, m.neutral ? c.s3 : c.s2);
    }
    const nA = S.mols.filter((m) => m.side === 0 && !m.fly).length, nB = S.mols.filter((m) => m.side === 1 && !m.fly).length;
    const la = S.scene === "nefron" ? "LÚMEN TUBULAR (urina)" : "A — estômago", lb = S.scene === "nefron" ? "PLASMA (sangue)" : "B — plasma";
    Draw.text(ctx, `${la} · pH ${fmt(pHA, 1)}`, mx / 2, 20, { align: "center", size: 14, weight: 700 });
    Draw.text(ctx, `${lb} · pH ${fmt(pHB, 1)}`, mx + (w - mx) / 2, 20, { align: "center", size: 14, weight: 700 });
    Draw.text(ctx, `${nA} moléculas`, mx / 2, hh - 12, { align: "center", size: 13 });
    Draw.text(ctx, `${nB} moléculas`, mx + (w - mx) / 2, hh - 12, { align: "center", size: 13 });
    Draw.legend(ctx, [[c.s3, `${neu} (atravessa)`], [c.s2, `${ion} (retida)`]], mx / 2, 42, mx - 30);
    if (S.scene === "nefron") {
      const fn = Phys.fracNeutral(pHA, S.p.pKa, "acido");
      Draw.arrow(ctx, mx - 70, hh / 2, mx + 70, hh / 2, c.s3, 2 + 10 * Math.min(1, fn * 300));
      Draw.text(ctx, "reabsorção passiva", mx, hh / 2 - 14, { align: "center", size: 12, color: c.s3, weight: 700 });
    }
  },
  liveCharts: false,
  chartTitles: (S) => ({ ionizacao: ["Frações em função do pH"], trapping: ["Concentração total no equilíbrio (A = 1)"], nefron: ["Razão urina/plasma × pH urinário"] }[S.scene]),
  charts(S, els) {
    if (S.scene === "ionizacao") {
      const fn = [], fi = []; for (let p = 0; p <= 14; p += 0.1) { const f = Phys.fracNeutral(p, S.p.pKa, S.p.tipo); fn.push([p, f * 100]); fi.push([p, (1 - f) * 100]); }
      const f = Phys.fracNeutral(S.p.pH, S.p.pKa, S.p.tipo);
      Chart.line(els[0], { id: "h1", series: [{ name: "não ionizada", color: "var(--s3)", pts: fn }, { name: "ionizada", color: "var(--s2)", pts: fi }], xlim: [0, 14], ylim: [0, 105],
        xlabel: "pH", ylabel: "% da molécula", vlines: [{ x: S.p.pKa, label: "pKa" }], markers: [{ x: S.p.pH, y: f * 100, label: fmt(f * 100, 1) + " % neutra", color: "var(--s3)" }], fmtTip: (v) => fmt(v, 1) + " %", fmtTipX: (v) => fmt(v, 1) });
      return;
    }

      Chart.bars(els[0], { bars: [{ label: "A (pH " + fmt(S.p.pH1, 1) + ")", value: 1, color: "var(--s1)" }, { label: "B (pH " + fmt(S.p.pH2, 1) + ")", value: rt, color: "var(--s3)" }], dec: rt > 100 ? 0 : 2, ylabel: "relativo" });
      return;
    }
    const pts = []; for (let p = 4.5; p <= 8.5; p += 0.05) pts.push([p, Phys.trapRatio(7.4, p, S.p.pKa, "acido")]);
    Chart.line(els[0], { id: "h3", series: [{ color: "var(--s1)", pts }], xlim: [4.5, 8.5], ylim: [pts[0][1] / 2, pts[pts.length - 1][1] * 2], logy: true, xlabel: "pH urinário", ylabel: "[total] urina / plasma",
      markers: [{ x: S.p.pHu, y: Phys.trapRatio(7.4, S.p.pHu, S.p.pKa, "acido"), label: "×" + fmtSci(Phys.trapRatio(7.4, S.p.pHu, S.p.pKa, "acido"), 2) }], fmtTip: (v) => "×" + fmtSci(v, 2), fmtTipX: (v) => fmt(v, 1) });
  },
  results(S) {
    if (S.scene === "ionizacao") {
      const f = Phys.fracNeutral(S.p.pH, S.p.pKa, S.p.tipo), ratio = S.p.tipo === "acido" ? Math.pow(10, S.p.pH - S.p.pKa) : Math.pow(10, S.p.pKa - S.p.pH);
      return [{ k: "Fração não ionizada", v: fmt(f * 100, 2) + " %", hl: true }, { k: "Fração ionizada", v: fmt((1 - f) * 100, 2) + " %" }, { k: S.p.tipo === "acido" ? "[A⁻]/[HA]" : "[BH⁺]/[B]", v: fmtSci(ratio, 2) }];
    }
    if (S.scene === "trapping") {
      const rt = Phys.trapRatio(S.p.pH1, S.p.pH2, S.p.pKa, S.p.tipo);
      const nA = S.mols.filter((m) => m.side === 0).length, nB = S.mols.length - nA;
      return [{ k: "f neutra em A", v: fmt(Phys.fracNeutral(S.p.pH1, S.p.pKa, S.p.tipo) * 100, 2) + " %" }, { k: "f neutra em B", v: fmt(Phys.fracNeutral(S.p.pH2, S.p.pKa, S.p.tipo) * 100, 3) + " %" },
        { k: "[total]B / [total]A (equilíbrio teórico)", v: "×" + fmtSci(rt, 3), hl: true }, { k: "Contagem simulada B/A", v: nA ? "×" + fmt(nB / nA, 1) : "todas em B" }];
    }
    const fn = Phys.fracNeutral(S.p.pHu, S.p.pKa, "acido"), ref = Phys.fracNeutral(5.5, S.p.pKa, "acido");
    return [{ k: "Fração não ionizada no lúmen", v: fmtSci(fn * 100, 2) + " %" }, { k: "Reabsorção passiva relativa (vs pH 5,5)", v: "×" + fmtSci(fn / ref, 2) },
      { k: "[total] urina / plasma (equilíbrio)", v: "×" + fmtSci(Phys.trapRatio(7.4, S.p.pHu, S.p.pKa, "acido"), 2), hl: true }];
  },
  actions(S, inst) {
    if (S.scene === "ionizacao") return [{ id: "est", label: "Estômago (pH 1,5)", fn: () => inst.set("pH", 1.5) }, { id: "pla", label: "Plasma (pH 7,4)", fn: () => inst.set("pH", 7.4) }, { id: "aas", label: "AAS (pKa 3,5)", fn: () => inst.setMany({ tipo: "acido", pKa: 3.5 }) }];
    if (S.scene === "trapping") return [{ id: "rst", label: "↺ Redistribuir moléculas", fn: () => this.init(S) }];
    return [{ id: "acida", label: "Urina ácida (5,5)", fn: () => inst.set("pHu", 5.5) }, { id: "alc", label: "Alcalinizar (8,0)", primary: true, fn: () => { inst.set("pHu", 8.0); flashEq(); } }];
  },
  equation: (S) => S.scene === "ionizacao" || S.scene === "nefron"
    ? (S.p.tipo === "base" && S.scene === "ionizacao" ? "pK<sub>a</sub> − pH = log([BH⁺]/[B]) &nbsp;·&nbsp; f<sub>B</sub> = 1/(1 + 10<sup>pKa − pH</sup>)" : "pH − pK<sub>a</sub> = log([A⁻]/[HA]) &nbsp;·&nbsp; f<sub>HA</sub> = 1/(1 + 10<sup>pH − pKa</sup>)") + "<small>só a forma não ionizada atravessa a bicamada com facilidade</small>"
    : "[total]<sub>B</sub>/[total]<sub>A</sub> = (1 + 10<sup>pH<sub>B</sub> − pKa</sup>) / (1 + 10<sup>pH<sub>A</sub> − pKa</sup>)<small>ácido fraco; a forma neutra se iguala nos dois lados</small>",
  explain(S) {
    if (S.scene === "ionizacao") return { que: `Neste pH, ${fmt(Phys.fracNeutral(S.p.pH, S.p.pKa, S.p.tipo) * 100, 1)} % da molécula está na forma não ionizada.`, porque: "Cada unidade de pH de diferença em relação ao pKa multiplica por 10 a razão entre as formas. Ácido em meio ácido fica neutro; base em meio básico fica neutra.", importa: "O pH muda a fração lipossolúvel e, portanto, a permeabilidade efetiva de fármacos e toxicantes." };
    if (S.scene === "trapping") return { que: "As moléculas se acumulam no compartimento onde ficam mais ionizadas.", porque: "Só a forma neutra atravessa e se iguala nos dois lados; do lado onde a molécula se ioniza, ela fica 'presa'.", importa: "Explica por que o AAS, neutro no estômago, é puxado para o plasma. Mas a maior parte da absorção real ocorre no intestino delgado, pela enorme área: o modelo é uma aproximação." };
    return { que: "Ao alcalinizar a urina, aumenta a fração ionizada do salicilato no lúmen e cai sua reabsorção passiva.", porque: "O salicilato ionizado não atravessa o epitélio tubular de volta ao sangue: fica aprisionado na urina.", importa: "É o princípio biofísico da alcalinização urinária na intoxicação por salicilatos (não é um protocolo de tratamento)." };
  },
  note: () => "partição pelo pH idealizada: só a forma neutra permeia (salvo o ajuste de permeabilidade relativa); pH constante em cada compartimento. A velocidade das travessias foi acelerada para visualização; a distribuição final segue o modelo. Número de partículas pequeno: a contagem flutua em torno da razão teórica.",
  bets: [
    { q: "Ao alcalinizar a urina (5,5 → 8,0), a eliminação de salicilato tende a:", opts: ["Diminuir", "Aumentar", "Não mudar"], correct: 1, scene: "nefron",
      apply: (S, i) => i.set("pHu", 8.0), why: "Mais salicilato ionizado no túbulo → menos reabsorção passiva → maior eliminação." },
    { q: "O AAS (pKa 3,5) no estômago (pH 1,5) está predominantemente:", opts: ["Ionizado", "Não ionizado (~99 %)", "Metade e metade"], correct: 1, scene: "ionizacao",
      apply: (S, i) => i.setMany({ tipo: "acido", pKa: 3.5, pH: 1.5 }), why: "pH − pKa = −2 → [A⁻]/[HA] = 0,01 → ~99 % neutro." },
  ],
  compare: [{ name: "Urina ácida × urina alcalina", a: { label: "pH urinário 5,5", scene: "nefron", p: { pHu: 5.5 } }, b: { label: "pH urinário 8,0", scene: "nefron", p: { pHu: 8.0 } } }],
});

/* ════════════════ MÓDULO 7 — LABORATÓRIO DE PERMEABILIDADE ════════════════ */
defModule({
  id: "lab", num: 7, title: "Laboratório experimental de permeabilidade", short: "Célula de difusão",
  achievement: "Ensaio de permeação interpretado",
  params: () => [
    { key: "h", label: "Espessura da barreira h", min: 20, max: 2000, log: true, value: 500, unit: "µm", fmt: (v) => fmt(v, 0) },
    { key: "D", label: "D na barreira", min: 1e-8, max: 1e-5, log: true, value: 5e-7, unit: "cm²/s" },
    { key: "K", label: "Partição K", min: 0.1, max: 10, log: true, value: 1, unit: "", fmt: (v) => fmt(v, 2) },
    { key: "C0", label: "C₀ doador", min: 1, max: 100, step: 1, value: 10, unit: "mM", dec: 0 },
    { key: "A", label: "Área", min: 0.5, max: 5, step: 0.1, value: 1.8, unit: "cm²" },
    { key: "V", label: "Volume receptor", min: 2, max: 20, step: 0.5, value: 12, unit: "mL" },
    { key: "tT", label: "Duração do ensaio", min: 1, max: 48, step: 1, value: 24, unit: "h", dec: 0 },
    { key: "noise", label: "Ruído experimental", min: 0, max: 0.15, step: 0.01, value: 0.04, unit: "", fmt: (v) => fmt(v * 100, 0) + " %" },
  ],
  init(S) { S.run = 0; S.samples = []; S.stir = 0; },
  model(S) {
    const h = S.p.h * 1e-4, tl = Phys.tLag(h, S.p.D), J = (S.p.D * S.p.K * S.p.C0 * 1e-6) / h;
    return { h, tl, J, P: J / (S.p.C0 * 1e-6) };
  },
  sampleAll(S) {
    const m = this.model(S), r = rng(77), n = 14, out = [];
    for (let k = 1; k <= n; k++) {
      const t = (k / n) * S.p.tT * 3600;
      const q = Phys.crankQ(t, m.h, S.p.D, S.p.K, S.p.C0) * S.p.A * 1e6; // µmol
      out.push([t / 3600, Math.max(0, q * (1 + S.p.noise * gauss(r)))]);
    }
    return out;
  },
  fit(S) {
    const pts = S.samples && S.samples.length ? S.samples : [];
    if (pts.length < 4) return null;
    const m = this.model(S);
    const sel = pts.filter((p) => p[0] * 3600 > 2.5 * m.tl);
    const use = sel.length >= 3 ? sel : pts.slice(-4);
    const f = Phys.linfit(use.map((p) => p[0]), use.map((p) => p[1]));
    const J = (f.b / 3600) / S.p.A * 1e-6, tl = -f.a / f.b * 3600;
    return { J, tl, D: tl > 0 ? (m.h * m.h) / (6 * tl) : NaN, P: J / (S.p.C0 * 1e-6), r2: f.r2, n: use.length, ok: sel.length >= 3 };
  },
  step(S, dt) {
    S.stir += dt * 8;
    if (S.run > 0 && S.run < 1) {
      S.run = Math.min(1, S.run + dt / 8);
      const all = this.sampleAll(S);
      S.samples = all.filter((p) => p[0] <= S.run * S.p.tT + 1e-9);
      if (S.run >= 1) { Achieve.give("lab", "Ensaio de permeação interpretado"); S.inst && S.inst.refresh(); }
      S.chartTimer = 1;
    }
  },
  liveCharts: true,
  draw(S, ctx, w, hh) {
    const c = Theme.c, cx = w / 2, cw = Math.min(260, w * 0.5);
    ctx.fillStyle = c.stage; ctx.fillRect(0, 0, w, hh);
    const top = 40, memY = hh * 0.42, bot = hh - 40;
    Draw.rrect(ctx, cx - cw * 0.35, top, cw * 0.7, memY - top, 8, c.s2 + "55", c.line);
    Draw.rrect(ctx, cx - cw / 2, memY + 14, cw, bot - memY - 14, 12, c.ecf, c.line);
    ctx.fillStyle = c.lipid; ctx.fillRect(cx - cw * 0.38, memY, cw * 0.76, 14);
    ctx.fillRect(cx + cw / 2, memY + 40, 50, 12);
    Draw.text(ctx, "porta de coleta", cx + cw / 2 + 56, memY + 50, { size: 12, color: c.muted });
    const frac = S.run || 0;
    const r2 = rng(13);
    for (let k = 0; k < 40; k++) Draw.dot(ctx, cx - cw * 0.3 + r2() * cw * 0.6, top + 10 + r2() * (memY - top - 20), 3.5, c.s2);
    const nRec = Math.round(30 * Math.min(1, frac * frac * 1.2));
    for (let k = 0; k < nRec; k++) Draw.dot(ctx, cx - cw * 0.45 + r2() * cw * 0.9, memY + 24 + r2() * (bot - memY - 40), 3.5, c.s2);
    ctx.save(); ctx.translate(cx, bot - 16); ctx.rotate(S.stir); Draw.rrect(ctx, -18, -4, 36, 8, 4, c.muted); ctx.restore();
    Draw.text(ctx, "DOADOR (C₀)", cx, top - 10, { align: "center", size: 13, weight: 700 });
    Draw.text(ctx, "barreira (h)", cx - cw * 0.38 - 8, memY + 11, { align: "right", size: 12, color: c.muted });
    Draw.text(ctx, "RECEPTOR · 37 °C · agitação", cx, bot + 22, { align: "center", size: 13, weight: 700 });
    Draw.text(ctx, S.run > 0 ? `ensaio: ${fmt(frac * S.p.tT, 1)} h de ${fmt(S.p.tT, 0)} h (tempo comprimido)` : "Pressione “Executar ensaio”", 12, 22, { size: 13 });
  },
  chartTitles: () => ["Quantidade acumulada no receptor × tempo"],
  charts(S, [a]) {
    const m = this.model(S), pts = [];
    for (let k = 0; k <= 120; k++) { const t = (k / 120) * S.p.tT; pts.push([t, Phys.crankQ(t * 3600, m.h, S.p.D, S.p.K, S.p.C0) * S.p.A * 1e6]); }
    const ymax = Math.max(...pts.map((p) => p[1]), ...S.samples.map((p) => p[1]), 1e-9) * 1.15;
    const f = this.fit(S), series = [{ name: "modelo (Crank)", color: "var(--s1)", pts, dash: "5 4", width: 1.8 }];
    if (f) series.push({ name: "ajuste linear", color: "var(--s2)", pts: [[f.tl / 3600, 0], [S.p.tT, (S.p.tT - f.tl / 3600) * f.J * S.p.A * 1e6 * 3600]] });
    Chart.line(a, { id: "l1", series, xlim: [0, S.p.tT], ylim: [0, ymax], xlabel: "tempo (h)", ylabel: "Q acumulada (µmol)",
      markers: S.samples.map((p) => ({ x: p[0], y: p[1], color: "var(--s3)" })), vlines: f && f.tl > 0 ? [{ x: f.tl / 3600, label: "t_lag" }] : [],
      fmtTip: (v) => fmtSci(v, 2) + " µmol", fmtTipX: (v) => fmt(v, 1) + " h" });
  },
  results(S) {
    const m = this.model(S), f = this.fit(S);
    const qEnd = Phys.crankQ(S.p.tT * 3600, m.h, S.p.D, S.p.K, S.p.C0) * S.p.A; // mol
    const cRec = (qEnd / (S.p.V / 1000)) * 1000; // mM
    const rows = [{ k: "t_lag teórico = h²/6D", v: fmtTime(m.tl) }, { k: "J teórico = D·K·C₀/h", v: fmtSci(m.J, 2) + " mol·cm⁻²·s⁻¹" }, { k: "P teórica", v: fmtSci(m.P, 2) + " cm/s" },
      { k: "Condição sink (C_rec/C₀ < 10 %)", v: fmt((100 * cRec) / S.p.C0, 1) + " %" + (cRec / S.p.C0 > 0.1 ? " ⚠" : " ✓") }];
    if (f) rows.push({ k: "J estimado (ajuste)", v: fmtSci(f.J, 2), hl: true }, { k: "t_lag estimado", v: fmtTime(f.tl), hl: true }, { k: "D estimado = h²/(6·t_lag)", v: fmtSci(f.D, 2) + " cm²/s", hl: true },
      { k: "P estimada = J/C₀", v: fmtSci(f.P, 2) + " cm/s" }, { k: "R² do ajuste", v: fmt(f.r2, 4) });
    if (S.p.tT * 3600 < 3 * m.tl) rows.push({ k: "Aviso", v: "ensaio curto: estado estacionário não atingido" });
    return rows;
  },
  actions(S, inst) {
    S.inst = inst;
    return [{ id: "run", label: "▶ Executar ensaio", primary: true, fn: () => { S.samples = []; S.run = 0.0001; } },
      { id: "fast", label: "Resultado imediato", fn: () => { S.samples = this.sampleAll(S); S.run = 1; } },
      { id: "rel", label: "Gerar relatório", fn: () => openReport(S, this) }];
  },
  equation: () => "Q(t) → J·A·(t − t<sub>lag</sub>), &nbsp; t<sub>lag</sub> = h²/(6D), &nbsp; P = J/C<sub>0</sub><small>solução de Crank para membrana com receptor em sink</small>",
  explain(S) {
    return { que: "A quantidade no receptor cresce devagar no início (latência) e depois de forma linear (estado estacionário).", porque: "Enquanto o perfil de concentração se forma dentro da barreira, o fluxo de saída é pequeno. Depois, o fluxo constante é J = D·K·C₀/h; extrapolando a reta, obtém-se t_lag e, dele, D.", importa: "Duas estimativas independentes de D (pelo fluxo e pelo t_lag) testam se o modelo de Fick descreve a barreira: é a base experimental do projeto de pesquisa." };
  },
  note: () => "barreira homogênea, receptor em condição sink, D e K constantes; dados simulados com ruído gaussiano reprodutível (semente fixa); ajuste linear apenas nos pontos com t > 2,5·t_lag.",
  bets: [{ q: "Se dobrarmos a espessura da barreira, o tempo de latência:", opts: ["Dobra", "Quadruplica", "Não muda"], correct: 1,
    apply: (S, i) => { i.set("h", S.p.h * 2); S.samples = []; S.run = 0.0001; }, why: "t_lag = h²/6D: depende do quadrado da espessura." }],
});

function openReport(S, def) {
  const rows = def.results(S).map((r) => `<tr><td>${r.k}</td><td class="num">${r.v}</td></tr>`).join("");
  const par = def.params(S).map((q) => `<tr><td>${q.label}</td><td class="num">${q.fmt ? q.fmt(S.p[q.key]) : (q.log ? fmtSci(S.p[q.key], 2) : fmt(S.p[q.key], q.dec ?? 1))} ${q.unit || ""}</td></tr>`).join("");
  const pts = S.samples.map((p) => `<tr><td class="num">${fmt(p[0], 2)}</td><td class="num">${fmtSci(p[1], 3)}</td></tr>`).join("");
  showModal(`<h2>Relatório do ensaio de permeação (simulado)</h2>
    <div class="roteiro"><h3>Condições</h3><div class="wrap"><table>${par}</table></div>
    <h3>Pontos coletados</h3><div class="wrap"><table><tr><th>t (h)</th><th>Q (µmol)</th></tr>${pts || "<tr><td colspan=2>Execute o ensaio.</td></tr>"}</table></div>
    <h3>Parâmetros</h3><div class="wrap"><table>${rows}</table></div>
    <p class="note">Dados gerados pelo modelo de Crank com ruído reprodutível — uso didático.</p></div>`);
}

/* ── didatica.js ── */
/* Camada didática de cada módulo:
   objetivo + guia  → roteiro guiado (faça → observe → conclua), por cena;
   leitura          → legenda em linguagem simples do que está acontecendo agora;
   conta            → a equação com os números atuais substituídos, passo a passo;
   simbolos         → o que significa cada letra da equação. */
"use strict";
const sg = (v, d = 2) => (v > 0 ? "+" : "") + fmt(v, d);
const cmM = (v) => (v < 0.01 ? fmtSci(v, 2) : fmt(v, v < 10 ? 1 : 0));
const SW = (v) => `var(--${v})`;
const xN = (v) => "×" + (v >= 10000 ? fmtSci(v, 2) : fmt(v, v < 10 ? 1 : 0));
const swatch = (c) => `<i class="sw" style="background:${SW(c)}"></i>`;
const linhas = (arr) => arr.map(([t, c]) => `<div>${c === "!" ? "⚠ " : c ? swatch(c) : ""}${t}</div>`).join("");
const RT_ATM = (Tc) => 0.082057 * (Tc + 273.15); // L·atm/mol
function attach(id, o) { Object.assign(Modules[id], o); }

/* ════════════════ 1 · POTENCIAL ELETROQUÍMICO ════════════════ */
attach("eletro", {
  objetivo: "entender que um íon sofre DUAS forças — a diferença de concentração (química) e a voltagem da membrana (elétrica) — e que a soma delas, ΔG, decide se ele tende a entrar ou a sair.",
  leitura(S) {
    const I = IONS[S.p.ion], L = I.label, g = this.calc(S), out = [];
    const rq = S.p.Ce / S.p.Ci;
    if (Math.abs(Math.log(rq)) < 0.05) out.push(["Concentrações iguais dos dois lados: <b>não há força química</b>.", "s3"]);
    else out.push([`Há <b>${(rq >= 1 ? rq : 1 / rq) >= 10000 ? fmtSci(rq >= 1 ? rq : 1 / rq, 1) : fmt(rq >= 1 ? rq : 1 / rq, (rq >= 1 ? rq : 1 / rq) < 10 ? 1 : 0)} vezes</b> mais ${L} ${rq >= 1 ? "fora" : "dentro"} → a força química empurra <b>${rq >= 1 ? "para DENTRO" : "para FORA"}</b> (${sg(g.chem, 1)} kJ/mol).`, "s3"]);
    if (Math.abs(S.p.Vm) < 1) out.push(["V<sub>m</sub> ≈ 0: <b>não há força elétrica</b>.", "s4"]);
    else {
      const atrai = (I.z > 0) === (S.p.Vm < 0);
      out.push([`O interior está <b>${S.p.Vm < 0 ? "negativo" : "positivo"}</b> (${fmt(S.p.Vm, 0)} mV) e o ${L} tem carga <b>${I.z > 0 ? "positiva" : "negativa"}</b>: cargas ${atrai ? "opostas se atraem" : "iguais se repelem"} → força elétrica <b>${atrai ? "para DENTRO" : "para FORA"}</b> (${sg(g.elec, 1)} kJ/mol).`, "s4"]);
    }
    const t = g.total, opostas = (g.chem < 0) !== (g.elec < 0) && Math.abs(g.elec) > 0.3 && Math.abs(g.chem) > 0.3;
    out.push([Math.abs(t) < 0.3 ? "As duas forças se cancelam: <b>ΔG ≈ 0, equilíbrio</b> — V<sub>m</sub> está no potencial de Nernst deste íon."
      : `Somando: <b>ΔG = ${sg(t, 1)} kJ/mol → o ${L} tende a ${t < 0 ? "ENTRAR" : "SAIR"}</b>${opostas ? ` (as forças se opõem; vence a ${Math.abs(g.chem) > Math.abs(g.elec) ? "química" : "elétrica"})` : ""}.`, "s2"]);
    if (+S.p.canal !== 1) out.push(["Mas o canal está fechado: sem via, o íon <b>quase não atravessa</b> a bicamada, mesmo com ΔG favorável.", "!"]);
    return linhas(out);
  },
  conta(S) {
    const I = IONS[S.p.ion], g = this.calc(S), lr = Math.log(S.p.Ci / S.p.Ce);
    const ver = Math.abs(g.total) < 0.3 ? "ΔG ≈ 0 → <b>equilíbrio</b>: entradas e saídas se igualam."
      : g.total < 0 ? "ΔG &lt; 0 → a <b>ENTRADA é espontânea</b> (basta haver uma via aberta)." : "ΔG &gt; 0 → entrar exigiria energia; o espontâneo é <b>SAIR</b>.";
    return [
      ["1 · Termo químico (concentrações)", `RT·ln(C<sub>i</sub>/C<sub>e</sub>) = ${fmt(g.rt, 3)} × ln(${cmM(S.p.Ci)} / ${cmM(S.p.Ce)}) = ${fmt(g.rt, 3)} × (${sg(lr, 2)}) = <b>${sg(g.chem, 2)} kJ/mol</b>`, SW("s3"),
        `RT = 8,314 × ${fmt(S.p.T + 273.15, 2)} K ÷ 1000 = ${fmt(g.rt, 3)} kJ/mol. Se C<sub>i</sub> &lt; C<sub>e</sub>, o ln é negativo: a concentração favorece a entrada.`],
      ["2 · Termo elétrico (voltagem)", `z·F·V<sub>m</sub> = (${sg(I.z, 0)}) × 96.485 × (${sg(S.p.Vm / 1000, 3)} V) ÷ 1000 = <b>${sg(g.elec, 2)} kJ/mol</b>`, SW("s4"),
        "V<sub>m</sub> entra em volts (−70 mV = −0,070 V); ÷ 1000 converte J em kJ. Carga e voltagem de sinais opostos → termo negativo (atração para dentro)."],

/* ════════════════ 4 · OSMOSE E TONICIDADE ════════════════ */
attach("osmose", {
  objetivo: (S) => S.scene === "hemacia" ? "distinguir osmolaridade (todas as partículas) de tonicidade (só as partículas que NÃO atravessam a membrana)."
    : "entender que a água vai para o lado com mais partículas dissolvidas e que a pressão osmótica é enorme (π = C·R·T).",
  leitura(S) {
    if (S.scene === "tubo") {
      const d = S.p.c2 - S.p.c1, dp = Math.abs(Phys.vantHoff(S.p.c2, S.p.T).mmHg - Phys.vantHoff(S.p.c1, S.p.T).mmHg);
      return Math.abs(d) < 5 ? "Mesma concentração dos dois lados: a água passa nos dois sentidos igualmente → <b>os níveis não mudam</b>."
        : `A água atravessa a membrana em direção ao lado <b>${d > 0 ? "direito" : "esquerdo"}</b>, que tem mais partículas (seta azul). O nível sobe desse lado até a pressão da coluna equilibrar a diferença de pressão osmótica (Δπ ≈ <b>${fmt(dp, 0)} mmHg</b>).`;
    }
    if (S.scene === "fragil") { const e = this.explain(S); return `<b>${e.que}</b> ${e.porque}`; }
    const V = S.cell.V, osmIn = rbcOsm(S), osmOut = S.p.imp + S.p.perm, dir = osmIn - osmOut;
    if (S.lysed) return `A célula inchou além do limite e <b>rompeu (hemólise)</b>: ${S.p.perm > 0 ? "a ureia entrou, a água foi atrás, e a célula não parou de inchar" : "fora havia menos soluto impermeante que dentro, e a água entrou sem parar"}.`;
    let s = `Fora: <b>${fmt(S.p.imp, 0)}</b> mOsm/L de soluto que NÃO entra (pontos azuis) + <b>${fmt(S.p.perm, 0)}</b> que entra (laranja). Dentro: ${fmt(osmIn, 0)} mOsm/L. `;
    s += Math.abs(dir) < 3 ? "Dentro e fora se equilibram → <b>a água não se move</b> e o volume fica estável." : dir > 0 ? "Dentro está mais concentrado → <b>a água ENTRA</b> e a célula incha." : "Fora está mais concentrado → <b>a água SAI</b> e a célula murcha.";
    if (S.p.perm > 0 && S.cell.s / V < S.p.perm - 5) s += " A ureia está <b>entrando</b> na célula: ela se soma aos solutos de dentro, e a água vai atrás.";
    return s;
  },
  conta(S) {
    if (S.scene === "tubo") {
      const p1 = Phys.vantHoff(S.p.c1, S.p.T), p2 = Phys.vantHoff(S.p.c2, S.p.T), d = Math.abs(p2.mmHg - p1.mmHg), rt = RT_ATM(S.p.T);
      return [["1 · Fórmula de van 't Hoff", "π = C·R·T", null, `R·T = 0,08206 × ${fmt(S.p.T + 273.15, 2)} K = ${fmt(rt, 2)} L·atm/mol`],
        ["2 · Lado esquerdo", `π = ${fmt(S.p.c1 / 1000, 3)} osmol/L × ${fmt(rt, 2)} = ${fmt(p1.atm, 2)} atm × 760 = <b>${fmt(p1.mmHg, 0)} mmHg</b>`, SW("s1")],
        ["3 · Lado direito", `π = ${fmt(S.p.c2 / 1000, 3)} osmol/L × ${fmt(rt, 2)} = ${fmt(p2.atm, 2)} atm × 760 = <b>${fmt(p2.mmHg, 0)} mmHg</b>`, SW("s3")],
        ["4 · Diferença", `Δπ = <b>${fmt(d, 0)} mmHg</b> ≈ coluna de ${fmt((d * 1.36) / 100, 1)} m de água`, SW("s2"), "1 mmHg ≈ 1,36 cm de água"]];
    }
    if (S.scene === "fragil") {
      const pct = S.p.nacl, osm = naclOsm(pct), V = fragV(pct), pop = FRAG[S.p.pop];
      return [["1 · NaCl → osmolaridade", `${fmtPct(pct)} % × (300 / 0,9) ≈ <b>${fmt(osm, 0)} mOsm/L</b>`, SW("s1"), "NaCl 0,9 % ≈ 300 mOsm/L (isotônico)"],
        ["2 · Volume de equilíbrio", `V/V₀ = 0,4 + 0,6 × 300 / ${fmt(Math.max(osm, 1), 0)} = <b>${osm < 1 ? "→ ∞" : fmt(V, 2)}</b>`, SW("s4"), "só a água livre (60 % do volume) acompanha a osmose"],
        ["3 · Comparar com o volume crítico", `${pop.label}: volume crítico médio ≈ ${fmt(pop.mu, 2)}·V₀`, SW(S.p.pop === "esfero" ? "s2" : "s1"), "acima dele a membrana não estica mais e rompe"],
        ["4 · Fração que rompe", `<b>${fmt(fragHem(pct, S.p.pop), 0)} %</b> de hemólise`, null, "é o que o laboratório lê na cor do sobrenadante"]];
    }
    const tot = S.p.imp + S.p.perm, rt = RT_ATM(37), pe = Phys.vantHoff(S.p.imp, 37);
    const osm = tot > 310 ? "hiperosmótica" : tot < 290 ? "hiposmótica" : "isosmótica", ton = S.p.imp > 310 ? "hipertônica" : S.p.imp < 290 ? "hipotônica" : "isotônica";
    const osmIn = rbcOsm(S), dir = osmIn - tot;
    return [["1 · Osmolaridade externa (todas as partículas)", `${fmt(S.p.imp, 0)} + ${fmt(S.p.perm, 0)} = <b>${fmt(tot, 0)} mOsm/L</b> → ${osm}`, SW("s1")],
      ["2 · Tonicidade (só as que NÃO atravessam, σ ≈ 1)", `<b>${fmt(S.p.imp, 0)} mOsm/L</b> → ${ton} (a célula tem ≈ 300 de impermeantes)`, SW("s2"), "a ureia (σ ≈ 0) entra na célula e não segura água fora: conta para a osmolaridade, não para a tonicidade"],
      ["3 · Pressão osmótica efetiva", `π<sub>ef</sub> = σ·C·R·T = ${fmt(S.p.imp / 1000, 3)} × ${fmt(rt, 2)} = ${fmt(pe.atm, 2)} atm = <b>${fmt(pe.mmHg, 0)} mmHg</b>`],
      ["4 · Agora: dentro × fora", `${fmt(osmIn, 0)} (dentro) − ${fmt(tot, 0)} (fora) = ${sg(dir, 0)} mOsm/L → <b>${Math.abs(dir) < 3 ? "água parada" : dir > 0 ? "água ENTRA" : "água SAI"}</b>`, null, "a água vai sempre para o lado mais concentrado"]];
  },
  simbolos: (S) => S.scene === "fragil" ? [["V/V₀", "volume da hemácia relativo ao volume no plasma"], ["b", "fração não osmótica do volume (≈ 0,4): hemoglobina e membrana — constante da célula"], ["π₀", "osmolaridade do plasma (≈ 300 mOsm/L) — referência"], ["π", "osmolaridade efetiva da solução do tubo — variável"]]
    : S.scene === "tubo" ? [["π", "pressão osmótica"], ["C", "concentração de partículas (osmol/L)"], ["R", "0,08206 L·atm·mol⁻¹·K⁻¹"], ["T", "temperatura em kelvin"]]
    : [["σ", "coeficiente de reflexão: 1 = o soluto não atravessa; 0 = atravessa livremente"], ["mOsm/L", "miliosmoles por litro: número de partículas dissolvidas"], ["π<sub>ef</sub>", "pressão osmótica efetiva (só solutos com σ ≈ 1)"]],
  guia: {
    hemacia: [
      { faca: "Coloque a hemácia em <b>NaCl 0,9 %</b>.", acao: (i) => i.set("sol", "nacl"), observe: "o volume relativo (≈ 1,00) e o gráfico de volume × tempo, que fica plano.", conclusao: "NaCl não entra na célula; com 300 mOsm/L dos dois lados, a água não se move: isotônica." },
      { faca: "Troque para a solução <b>hipertônica</b> (450 mOsm/L).", acao: (i) => i.set("sol", "hiper"), observe: "as setas azuis apontam para fora e a hemácia murcha (fica crenada).", conclusao: "mais soluto impermeante fora → a água sai da célula." },
      { faca: "Troque para a <b>hipotônica</b> (NaCl 0,45 %, 150 mOsm/L).", acao: (i) => i.set("sol", "hipo"), observe: "as setas apontam para dentro e a célula incha até ficar quase esférica.", conclusao: "menos soluto fora → a água entra. O volume vai a ≈ 1,6·V₀ (não dobra, porque ≈ 40 % do volume é hemoglobina e membrana): a célula fica no limite da lise — é nessa faixa que começa a hemólise no teste de fragilidade." },
      { faca: "Agora <b>água pura</b>.", acao: (i) => i.set("sol", "agua"), observe: "a água entra sem parar e a hemácia rompe.", conclusao: "sem soluto fora, não há equilíbrio possível: hemólise. Por isso nunca se infunde água pura na veia." },
      { faca: "Agora o ponto-chave: <b>ureia 300 mM</b>, com a MESMA osmolaridade do plasma.", acao: (i) => i.set("sol", "ureia"), observe: "os pontos laranja (ureia) entram na célula; ela incha até romper.", conclusao: "isosmótica não é isotônica: a ureia atravessa a membrana (σ ≈ 0), leva a água junto e provoca hemólise." },
      { faca: "Repita a ureia <b>sem aquaporinas</b>.", acao: (i) => { i.set("aqp", 0); i.set("sol", "ureia"); }, observe: "o gráfico de volume sobe bem mais devagar.", conclusao: "as aquaporinas mudam a VELOCIDADE do movimento da água, não o seu destino." },
    ],
    fragil: [
      { faca: "Comece em <b>NaCl 0,9 %</b> e reduza para <b>0,6 %</b>.", acao: (i) => i.set("nacl", 0.6), observe: "as hemácias normais incham, mas nenhuma rompe; o tubo continua claro.", conclusao: "o volume de equilíbrio (≈ 1,3·V₀) ainda está abaixo do volume crítico das células normais." },
      { faca: "Reduza para <b>0,45 %</b> e depois <b>0,35 %</b>.", acao: (i) => i.set("nacl", 0.35), observe: "as primeiras células rompem perto de 0,45 %; em 0,35 % quase todas; o sobrenadante fica vermelho.", conclusao: "é a curva normal do teste: início ≈ 0,45–0,50 %, hemólise completa ≈ 0,30–0,35 %." },
      { faca: "Troque a amostra para <b>esferocitose hereditária</b> e volte a <b>0,6 %</b>.", acao: (i) => i.setMany({ pop: "esfero", nacl: 0.6 }), observe: "metade das hemácias já rompe em 0,6 %, onde as normais estavam intactas.", conclusao: "o esferócito tem menos membrana sobrando: atinge o volume crítico antes. A curva se desloca para a direita — base do diagnóstico laboratorial." },

attach("starling", {

      + `Em média, a filtração líquida é ${fmt(r.Jv, 1)} contra uma capacidade de drenagem linfática de ${fmt(r.lymph, 0)}: `
      + (r.edema ? "<b>sobra líquido no interstício → EDEMA</b> (o fundo do palco fica azulado)." : "<b>a linfa dá conta</b> e não há edema.");
  },

    const um = (Pc, nome) => `(${fmt(Pc, 0)} − ${fmt(S.p.Pi, 0)}) − ${fmt(S.p.sigma, 2)} × (${fmt(S.p.pic, 0)} − ${fmt(S.p.pii, 0)}) = ${fmt(Pc - S.p.Pi, 1)} − ${fmt(opp, 1)} = <b>${sg(Pc - S.p.Pi - opp, 1)} mmHg</b>`;
    return [["1 · Fórmula", "NFP = (P<sub>c</sub> − P<sub>i</sub>) − σ·(π<sub>c</sub> − π<sub>i</sub>)", null, "primeiro parêntese: empurra para FORA · segundo: segura DENTRO"],
      ["2 · Ponta arterial", "NFP = " + um(S.p.Pa), SW("s2"), r.pts[0][2] > 0 ? "positivo → filtração" : "negativo → reabsorção"],
      ["3 · Ponta venular", "NFP = " + um(S.p.Pv), SW("s3"), r.pts[r.pts.length - 1][2] > 0 ? "positivo → filtração" : "negativo → reabsorção"],
      ["4 · Ao longo do capilar", `NFP média = ${fmt(r.nfp, 1)} mmHg → J<sub>v</sub> = K<sub>f</sub> × NFP = ${fmt(S.p.Kf, 1)} × ${fmt(r.nfp, 1)} = <b>${fmt(r.Jv, 1)}</b>`, null,
        `comparar com a drenagem linfática (${fmt(r.lymph, 0)}): ${r.edema ? "maior → edema" : "menor → sem edema"}`]];
  },
  simbolos: () => [["P<sub>c</sub>", "pressão hidrostática no capilar (cai da arteríola para a vênula)"], ["P<sub>i</sub>", "pressão hidrostática do interstício"],
    ["π<sub>c</sub>", "pressão oncótica do plasma (sobretudo albumina)"], ["π<sub>i</sub>", "pressão oncótica do interstício"],
    ["σ", "coeficiente de reflexão das proteínas: 1 = parede impermeável a proteínas"], ["K<sub>f</sub>", "coeficiente de filtração (condutância e área da parede)"], ["NFP", "pressão efetiva de filtração; J<sub>v</sub> = K<sub>f</sub>·NFP"]],
  guia: { main: [
    { faca: "Comece no cenário <b>normal</b>.", acao: (i) => i.set("preset", "normal"), observe: "setas laranja (filtração) na ponta arterial, à esquerda; menores ou verdes (reabsorção) à direita.", conclusao: "há filtração na ponta arterial e pouca reabsorção na venular; o excedente é drenado pela linfa." },

/* Aba DESAFIO: geradores de questões. Gabaritos e distratores calculados pelo código. */
"use strict";
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b, step = 1) => Math.round((a + Math.random() * (b - a)) / step) * step;
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }

/** Monta questão: corretas/distratores [{t, why}]; garante textos distintos. */
function Q(cat, level, stem, right, wrongs, mod, scene, explain) {
  const seen = new Set([right.t]);
  const ws = wrongs.filter((w) => !seen.has(w.t) && seen.add(w.t)).slice(0, 3);
  const opts = shuffle([{ ...right, ok: true }, ...ws]);
  return { cat, level, stem, opts, correct: opts.findIndex((o) => o.ok), mod, scene, explain };
}

const Quiz = {
  score: 0, total: 0, streak: 0, level: "todos", cat: "todas", quick: 0, cur: null,
  next() {
    const pool = [];
    for (let k = 0; k < 60 && pool.length < 1; k++) {
      const q = pick(GEN)();
      if ((this.level === "todos" || q.level === this.level) && (this.cat === "todas" || q.cat === this.cat)) pool.push(q);
    }
    this.cur = pool[0] || pick(GEN)();
    this.render();
  },
  render() {
    const host = $("#quizCard"), q = this.cur;
    host.innerHTML = "";
    const opts = h("div", { class: "opts" }), feed = h("div", { "aria-live": "polite" });
    let done = false;
    q.opts.forEach((o, i) => {
      const b = h("button", {}, `${"ABCD"[i]}. ${o.t}`);
      b.onclick = () => {
        if (done) return; done = true;
        this.total++;
        const ok = i === q.correct;
        if (ok) { this.score++; this.streak++; } else this.streak = 0;
        $$("button", opts).forEach((x, k) => {
          if (k === q.correct) x.classList.add("right"); else if (k === i) x.classList.add("wrong");
          x.append(h("div", { class: "why" }, (k === q.correct ? "✓ " : "✗ ") + q.opts[k].why));
        });
        feed.innerHTML = `<p class="verdict ${ok ? "ok" : "no"}"><b>${ok ? "Correto." : "Incorreto."}</b> ${q.explain || ""}</p>`;
        if (this.streak === 3) toast("Sequência de 3 acertos");
        this.updScore();
        if (this.quick) { this.quick--; if (this.quick === 0) setTimeout(() => toast(`Desafio rápido concluído: ${this.score}/${this.total}`), 400); }
      };
      opts.append(b);
    });
    host.append(h("div", { class: "meta" }, `${CATS[q.cat]} · nível ${q.level}`), h("div", { class: "stem" }, q.stem), opts, feed,
      h("div", { class: "actions" },
        h("button", { class: "btn primary", onclick: () => this.next() }, "Próxima questão →"),
        h("button", { class: "btn", onclick: () => App.openModule(q.mod, q.scene) }, "Explorar este fenômeno")));
  },
  updScore() { $("#quizScore").textContent = `${this.score}/${this.total} acertos · sequência ${this.streak}`; },
  reset() { this.score = 0; this.total = 0; this.streak = 0; this.updScore(); this.next(); },
};

function buildQuiz(host) {
  const lv = h("select", { id: "qLevel", "aria-label": "Nível" }, [["todos", "Todos os níveis"], ["básico", "Básico"], ["intermediário", "Intermediário"], ["avançado", "Avançado"]].map(([v, l]) => h("option", { value: v }, l)));
  const ct = h("select", { id: "qCat", "aria-label": "Categoria" }, h("option", { value: "todas" }, "Todas as categorias"), Object.entries(CATS).map(([v, l]) => h("option", { value: v }, l)));
  lv.onchange = () => { Quiz.level = lv.value; Quiz.next(); };
  ct.onchange = () => { Quiz.cat = ct.value; Quiz.next(); };
  host.append(h("div", { class: "quiz" },
    h("div", { class: "quizbar" }, lv, ct,
      h("button", { class: "btn", onclick: () => { Quiz.quick = 3; Quiz.reset(); toast("Desafio rápido: 3 questões"); } }, "Desafio rápido (3)"),
      h("button", { class: "btn ghost", onclick: () => Quiz.reset() }, "↺ Reiniciar placar"),
      h("span", { class: "score", id: "quizScore" }, "0/0 acertos · sequência 0")),
    h("section", { class: "panel qcard", id: "quizCard" })));
  Quiz.next();
}

const Prof = {
  on: false, cur: null, step: 0, inst: null, essential: false, t0: 0, elapsed: 0, running: false, timer: 0, classVote: null, done: new Set(),
  list() { return DEMOS.filter((d) => !this.essential || d.ess); },
  open(id) {
    this.on = true; $("#prof").hidden = false; document.body.style.overflow = "hidden";
    App.pauseExplore(true);
    this.renderTop();
    this.load(id || (this.cur && this.cur.id) || "D1");
  },
  close() { this.on = false; $("#prof").hidden = true; document.body.style.overflow = ""; if (this.inst) { this.inst.destroy(); this.inst = null; } App.pauseExplore(false); },
  renderTop() {
    const box = $("#demoBtns"); box.innerHTML = "";
    for (const d of DEMOS) {
      if (this.essential && !d.ess) continue;
      box.append(h("button", { class: d.opt ? "opt" : "", "aria-current": String(this.cur && this.cur.id === d.id), onclick: () => this.load(d.id), title: `Slides ${d.slides} · ${mmss(d.win[0])}–${mmss(d.win[1])}` },
        h("span", { class: "k" }, d.key), d.title));
    }
    $("#essBtn").setAttribute("aria-pressed", String(this.essential));
  },
  load(id) {
    const d = DEMOS.find((x) => x.id === id); if (!d) return;
    this.cur = d; this.step = 0; this.classVote = null;
    if (this.inst) this.inst.destroy();
    const stage = $("#pStage"); stage.innerHTML = ""; $("#pCharts").innerHTML = "";
    const def = Modules[d.mod];
    this.inst = mountSim(def, { stage, charts: $("#pCharts"), ctrls: $("#pCtrls"), results: $("#pResults"), eq: $("#pEq"), leitura: $("#pLeitura"), conta: $("#pConta") }, { scene: d.scene === "main" ? undefined : d.scene, preset: d.preset, controls: d.controls.length ? d.controls : ["__none__"], big: true });
    this.inst.S.big = true;
    $("#pTitle").textContent = `${d.id} · ${d.title}`;
    $("#pMeta").textContent = `Slides ${d.slides} · janela ${mmss(d.win[0])}–${mmss(d.win[1])} · ${d.dur}`;
    this.renderTop(); this.renderStep();
    if (location.hash !== "#" + d.id) history.replaceState(null, "", "#" + d.id);
  },
  renderStep() {
    const d = this.cur, s = this.step;
    $$("#pSteps span").forEach((el, k) => { el.className = k === s ? "on" : k < s ? "done" : ""; });
    $("#pQ").textContent = d.q;
    const opts = $("#pOpts"); opts.innerHTML = "";
    $("#pOptsBox").hidden = s < 1;
    d.opts.forEach((o, k) => {
      const b = h("button", { "aria-pressed": String(this.classVote === k) }, `${"ABCD"[k]}. ${o}`);
      b.onclick = () => { this.classVote = k; this.renderStep(); };
      if (s >= 3 && d.correct != null) { if (k === d.correct) b.classList.add("right"); else if (k === this.classVote) b.classList.add("wrong"); }
      opts.append(b);
    });
    $("#pVote").textContent = this.classVote == null ? "Resposta da turma: clique numa alternativa (ou tecle A–D)." : `Previsão registrada da turma: ${"ABCD"[this.classVote]}`;
    const ex = $("#pExp"); ex.innerHTML = "";
    $("#pExpBox").hidden = s < 2;
    d.exp.forEach((a) => ex.append(h("button", { class: "btn" + (a.primary ? " primary" : ""), onclick: () => { a.fn(this.inst); this.inst.refresh(); } }, a.label)));
    $("#pCtrls").hidden = s < 2 || !d.controls.length;
    const rv = $("#pReveal");
    rv.hidden = s < 3;
    if (s >= 3) { const r = d.reveal(this.inst); rv.innerHTML = `<div class="big">${r.big}</div><div>${r.txt}</div>`; }
    const xp = $("#pExplain");
    xp.hidden = s < 4;
    if (s >= 4) renderExplain(xp, d.exp3, Modules[d.mod].note && Modules[d.mod].note(this.inst.S));
    $("#pEqBox").hidden = s < 3;
    $("#pNext").textContent = s < 4 ? `Próxima etapa: ${STEPS[s + 1]} →` : "Demonstração concluída ✓";
    if (s === 4) { this.done.add(d.id); }
  },
  next() { if (this.step < 4) { this.step++; if (this.step === 3) flashEq(); this.renderStep(); } },
  prev() { if (this.step > 0) { this.step--; this.renderStep(); } },
  resetDemo() { this.load(this.cur.id); },
  /* cronômetro */
  toggleClock() {
    if (this.running) { this.elapsed += (performance.now() - this.t0) / 60000; this.running = false; }
    else { this.t0 = performance.now(); this.running = true; }
    $("#clkBtn").textContent = this.running ? "⏸" : "▶";
    if (!this.timer) this.timer = setInterval(() => this.tick(), 500);
    this.tick();
  },
  resetClock() { this.elapsed = 0; this.t0 = performance.now(); this.tick(); },
  now() { return this.elapsed + (this.running ? (performance.now() - this.t0) / 60000 : 0); },
  tick() {
    const m = this.now(), b = BLOCOS.find((x) => m >= x[0] && m < x[1]) || BLOCOS[BLOCOS.length - 1];
    const nxt = this.list().filter((d) => !d.opt && !this.done.has(d.id)).find((d) => d.win[1] >= m - 0.01) || null;
    const late = nxt && m > nxt.win[1];
    const lateAny = this.list().filter((d) => !d.opt && !this.done.has(d.id)).some((d) => m > d.win[1] + 0.5);
    $("#clkTime").textContent = mmss(m);
    $("#clkInfo").textContent = `${b[2]} · próxima: ${nxt ? `${nxt.id} (${mmss(nxt.win[0])})` : "—"}`;
    $("#clock").classList.toggle("late", !!(late || lateAny));
    $("#clkLate").hidden = !(late || lateAny);
  },
  toggleEssential() { this.essential = !this.essential; this.renderTop(); toast(this.essential ? "Modo Essencial: só as demonstrações prioritárias" : "Todas as demonstrações visíveis"); },
  key(e) {
    if (!this.on) return;
    if (e.target.matches("input, select, textarea")) return;
    const k = e.key;
    const d = DEMOS.find((x) => x.key === k && (!this.essential || x.ess));
    if (d) { this.load(d.id); e.preventDefault(); return; }
    if (k === "ArrowRight" || k === "Enter") { this.next(); e.preventDefault(); }
    else if (k === "ArrowLeft") { this.prev(); e.preventDefault(); }
    else if (k === "r" || k === "R") this.resetDemo();
    else if (k === " ") { this.inst.S.paused = !this.inst.S.paused; e.preventDefault(); }
    else if ("abcdABCD".includes(k) && k.length === 1) { const i = "abcd".indexOf(k.toLowerCase()); if (i < this.cur.opts.length) { this.classVote = i; this.renderStep(); } }
    else if (k === "t" || k === "T") this.toggleClock();
    else if (k === "e" || k === "E") this.toggleEssential();
    else if (k === "f" || k === "F") App.fullscreen();
    else if (k === "Escape") { if (!$("#modal").hidden) App.closeModal(); else this.close(); }
    else if (k === "?") App.help();
  },
  roteiro() {
    const rows = DEMOS.map((d) => `<tr><td>${d.slides}</td><td><b>${d.id}${d.opt ? " (opcional)" : ""}</b> ${d.title}${d.ess ? " ★" : ""}</td><td>${mmss(d.win[0])}–${mmss(d.win[1])}<br><small>${d.dur}</small></td>
      <td>${d.q}</td><td>${Modules[d.mod].title}</td><td>${d.inicial}</td><td>${d.alteracao}</td><td>${d.reveal(this.inst && this.cur && this.cur.id === d.id ? this.inst : { S: { p: d.preset, scene: d.scene } }).big}</td><td>${d.fala}</td>
      <td><button class="btn primary" data-open="${d.id}">Abrir</button></td></tr>`).join("");
    showModal(`<h2>Roteiro da aula — ≈ 43 minutos (teto 45 · edital 40–50)</h2>
      <p class="note">Slides da aula v2 (59 slides). A demonstração 6 (hemácia) é feita AO VIVO no fechamento (slides 52–55); as demais já estão nos slides como animações e servem para demonstrar ao vivo se houver tempo ou pergunta da banca. ★ = demonstração do Modo Essencial. As demonstrações substituem trechos expositivos dos slides indicados; não acrescentam tempo.</p>
      <div class="actions"><button class="btn" id="cpRot">Copiar orientação para o professor</button><button class="btn" id="prRot">Imprimir roteiro</button></div>
      <div class="roteiro"><div class="wrap"><table><tr><th>Slide</th><th>Demonstração</th><th>Janela</th><th>Pergunta</th><th>Módulo</th><th>Parâmetros iniciais</th><th>Alteração</th><th>Resultado esperado</th><th>Fala sugerida</th><th></th></tr>${rows}</table></div></div>`);
    $$("[data-open]").forEach((b) => (b.onclick = () => { App.closeModal(); this.load(b.dataset.open); }));
    $("#cpRot").onclick = () => copyText(this.roteiroTexto());
    $("#prRot").onclick = () => { const pa = $("#printArea"); pa.innerHTML = $(".modal .box").innerHTML; window.print(); };
  },
  roteiroTexto() {
    return "ROTEIRO — Prova Didática Ponto 4 (≈ 43 min; teto 45)\n\n" + DEMOS.map((d) => `${d.id}${d.opt ? " (opcional)" : ""} · ${d.title}\nSlides ${d.slides} · ${mmss(d.win[0])}–${mmss(d.win[1])} · ${d.dur}\nPergunta: ${d.q}\nInicial: ${d.inicial}\nAlteração: ${d.alteracao}\nFala: ${d.fala}\n`).join("\n");
  },
};

function copyText(txt) {
  const done = () => toast("Roteiro copiado");
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
  function fallback() {
    const ta = h("textarea", { style: "position:fixed;left:-9999px" }); ta.value = txt; document.body.append(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("Selecione e copie manualmente"); }
    ta.remove();
  }
}

/* Autoteste (abrir com #selftest): exercita módulos, cenas, ações, apostas, comparações, demonstrações e questões. */
function selfTest() {
  const errs = [], log = [];
  const tryit = (nome, f) => { try { f(); } catch (e) { errs.push(`${nome}: ${e && e.message}`); } };
  const run = (inst, n = 30) => { for (let k = 0; k < n; k++) { inst.step(0.05); inst.draw(); } inst.refresh(); };
  for (const id of ModOrder) {
    const def = Modules[id];
    const scenes = def.scenes ? def.scenes.map((s) => s.id) : ["main"];
    for (const sc of scenes) {
      tryit(`${id}/${sc} abrir`, () => { App.openModule(id, sc === "main" ? undefined : sc); run(App.inst); });
      tryit(`${id}/${sc} ações`, () => { const acts = def.actions ? def.actions(App.inst.S, App.inst) : []; acts.forEach((a) => { a.fn(); run(App.inst, 10); }); log.push(`${id}/${sc}: ${acts.length} ações`); });
      tryit(`${id}/${sc} parâmetros`, () => { for (const q of def.params(App.inst.S)) { if (q.options) for (const [v] of q.options) App.inst.set(q.key, isNaN(+v) ? v : +v); else { App.inst.set(q.key, q.max); run(App.inst, 3); App.inst.set(q.key, q.min); } run(App.inst, 3); } });
      tryit(`${id}/${sc} didática`, () => {
        App.openModule(id, sc === "main" ? undefined : sc); run(App.inst, 3);
        const chk = (onde) => { const S = App.inst.S, txt = (def.leitura ? def.leitura(S) : "") + JSON.stringify(def.conta ? def.conta(S) : []);
          if (/NaN|undefined|Infinity/.test(txt)) throw new Error(`${onde}: ${txt.slice(0, 160)}`); };
        chk("inicial");
        const g = def.guia ? (def.guia[App.inst.S.scene] || def.guia.main || []) : [];
        if (!g.length) throw new Error("sem roteiro guiado");
        g.forEach((st, k) => { if (st.acao) { st.acao(App.inst); App.closeModal(); } run(App.inst, 8); chk("passo " + (k + 1)); });
        log.push(`${id}/${sc}: roteiro ${g.length} passos`);
      });
      tryit(`${id}/${sc} resultados finitos`, () => { App.inst.reset(); run(App.inst, 5); (def.results(App.inst.S) || []).forEach((r) => { if (/NaN|undefined/.test(r.v)) throw new Error(`${r.k} = ${r.v}`); }); });
    }
    (def.bets || []).forEach((b, k) => tryit(`${id} aposta ${k}`, () => { App.openModule(id); if (b.scene) App.inst.setScene(b.scene); b.apply(App.inst.S, App.inst); run(App.inst, 10); }));
    (def.compare || []).forEach((c, k) => tryit(`${id} comparação ${k}`, () => { App.openModule(id); const sel = $("#cmp_" + id); sel.value = String(k); sel.onchange(); for (let j = 0; j < 10; j++) Ticker.loop(performance.now()); }));
  }
  for (const d of DEMOS) tryit(`Prof ${d.id}`, () => {
    Prof.open(d.id); run(Prof.inst, 5);
    for (let s = 0; s < 4; s++) { Prof.next(); run(Prof.inst, 3); }
    d.exp.forEach((a) => { a.fn(Prof.inst); run(Prof.inst, 10); });
    Prof.renderStep(); if ($("#pReveal").textContent.includes("undefined") || $("#pReveal").textContent.includes("NaN")) throw new Error("revelação inválida");
    Prof.close();
  });
  tryit("Roteiro", () => { Prof.open("D1"); Prof.roteiro(); App.closeModal(); Prof.toggleClock(); Prof.tick(); Prof.toggleEssential(); Prof.toggleEssential(); Prof.close(); });
  let bad = 0;
  for (let k = 0; k < 300; k++) tryit("questão", () => { const q = pick(GEN)(); if (q.opts.length < 3 || q.correct < 0 || q.opts.some((o) => /NaN|undefined|Infinity/.test(o.t))) { bad++; errs.push("questão ruim: " + q.stem + " | " + q.opts.map((o) => o.t).join(" / ")); } });
  tryit("caso clínico", () => { App.caso(); App.closeModal(); App.help(); App.closeModal(); });
  const out = h("pre", { id: "selftest" }, (errs.length ? `SELFTEST FALHOU (${errs.length})\n` + errs.join("\n") : "SELFTEST OK") + "\n" + log.join("\n"));
  document.body.prepend(out);
  document.title = errs.length ? `SELFTEST FAIL ${errs.length}` : "SELFTEST OK";
  console.log(out.textContent);
}
