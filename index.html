<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratório de Biofísica — Transporte</title>
<style>/* Layout: bancada de laboratório — palco de simulação à esquerda, painel de instrumentos à direita;
   no Modo Professor o palco ocupa a tela e o painel vira uma faixa de condução da demonstração. */
:root {
  --bg: #eef3f6; --surface: #ffffff; --surface-2: #f6f9fb; --ink: #13212b; --muted: #566876; --line: #d3dde4;
  --accent: #0b7480; --accent-ink: #ffffff; --warm: #b45f12; --good: #2b7a3d; --bad: #b3261e;
  --s1: #1F6FB2; --s2: #C46A1A; --s3: #2A9D8F; --s4: #7B5CC7;
  --ecf: #dceef6; --icf: #f5e9f0; --lipid: #e3a24a; --tail: #c9b48a; --stage: #fbfdfe;
  --font-display: "Avenir Next", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-eq: "STIX Two Math", "Cambria Math", "Cambria", "Times New Roman", serif;
  --font-mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px; --shadow: 0 1px 2px rgba(19, 33, 43, .06), 0 4px 16px rgba(19, 33, 43, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1419; --surface: #152029; --surface-2: #1a2732; --ink: #e4edf2; --muted: #93a6b3; --line: #2a3a46;
    --accent: #3bb3bc; --accent-ink: #06191c; --warm: #e39a54; --good: #6cc183; --bad: #f08a80;
    --s1: #4A97D4; --s2: #CC7A32; --s3: #28A090; --s4: #9578D6;
    --ecf: #12303b; --icf: #33212c; --lipid: #c98a3a; --tail: #7d6c4c; --stage: #111b22;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1419; --surface: #152029; --surface-2: #1a2732; --ink: #e4edf2; --muted: #93a6b3; --line: #2a3a46;
  --accent: #3bb3bc; --accent-ink: #06191c; --warm: #e39a54; --good: #6cc183; --bad: #f08a80;
  --s1: #4A97D4; --s2: #CC7A32; --s3: #28A090; --s4: #9578D6;
  --ecf: #12303b; --icf: #33212c; --lipid: #c98a3a; --tail: #7d6c4c; --stage: #111b22;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ── Cabeçalho ── */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { font-size: 18px; letter-spacing: .01em; }
.brand small { color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.tabs button { border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.top-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer;
  font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.warm { background: var(--warm); color: #fff; border-color: var(--warm); }
.btn.ghost { background: transparent; }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

main { padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ── Explorar ── */
.modnav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; }
.modnav button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px;
  cursor: pointer; text-align: left; min-width: 150px; }
.modnav button b { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.modnav button[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }

.bench { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .bench { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.panel > header { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  padding: 10px 14px; border-bottom: 1px solid var(--line); }
.panel > header h2 { font-size: 16px; }
.panel .body { padding: 12px 14px; display: grid; gap: 12px; }
.scenes { display: flex; gap: 6px; flex-wrap: wrap; }
.scenes button { font-size: 13px; padding: 5px 10px; }

.stage { position: relative; background: var(--stage); border-radius: 8px; border: 1px solid var(--line); overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 340px; }
.stage .badge { font-size: 11px; color: var(--muted); background: var(--surface); border-top: 1px solid var(--line); padding: 3px 8px; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.chart { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px; position: relative; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .ttl { font-size: 12px; font-weight: 700; color: var(--muted); padding: 2px 6px; text-transform: uppercase; letter-spacing: .05em; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 4px 7px;
  border-radius: 6px; white-space: nowrap; transform: translate(-50%, -120%); font-family: var(--font-mono); }

.runbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.runbar .speed { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

.ctrl { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.ctrl label { font-size: 13px; font-weight: 600; }
.ctrl output { font-family: var(--font-mono); font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
.ctrl input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.ctrl select { grid-column: 1 / -1; padding: 5px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }
.ctrls { display: grid; gap: 10px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }

.results { display: grid; gap: 4px; }
.results .row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.results .row span:last-child { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.results .row.hl span:last-child { color: var(--warm); font-weight: 700; }

.eq { font-family: var(--font-eq); font-size: 20px; text-align: center; padding: 10px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--line); line-height: 1.35; }
.eq.flash { animation: flash 1.2s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 var(--warm); } 30% { box-shadow: 0 0 0 6px var(--warm); } 100% { box-shadow: 0 0 0 0 transparent; } }
.eq small { display: block; font-family: var(--font-body); font-size: 12px; color: var(--muted); margin-top: 4px; }

.explain { display: grid; gap: 8px; }
.explain details { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--surface-2); }
.explain summary { cursor: pointer; font-weight: 700; font-size: 14px; }
.explain p { margin: 6px 0 2px; font-size: 14px; }
.note { font-size: 12px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 8px; }

.bet { border: 1px solid var(--warm); border-radius: 8px; padding: 10px; display: grid; gap: 8px; }
.bet h3 { font-size: 14px; color: var(--warm); text-transform: uppercase; letter-spacing: .05em; }
.bet .q { font-weight: 600; }
.opts { display: grid; gap: 6px; }
.opts button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.opts button[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent); }
.opts button.right { border-color: var(--good); box-shadow: inset 3px 0 0 var(--good); }
.opts button.wrong { border-color: var(--bad); box-shadow: inset 3px 0 0 var(--bad); }
.verdict { font-size: 14px; }
.verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }

.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .compare { grid-template-columns: 1fr; } }
.compare .stage canvas { height: 240px; }

/* ── Desafio ── */
.quiz { max-width: 860px; margin: 0 auto; display: grid; gap: 14px; }
.quizbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.quizbar .score { margin-left: auto; font-family: var(--font-mono); }
.qcard { padding: 18px; display: grid; gap: 12px; }
.qcard .meta { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.qcard .stem { font-size: 18px; font-weight: 600; }
.qcard .opts button { padding: 10px 12px; font-size: 15px; }
.qcard .why { font-size: 13px; color: var(--muted); margin-top: 4px; }

/* ── Modal / toasts ── */
.modal { position: fixed; inset: 0; background: rgba(5, 12, 16, .55); display: grid; place-items: center; z-index: 60;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal .box { background: var(--surface); color: var(--ink); border-radius: 12px; max-width: 760px; width: 100%; max-height: 88vh; overflow: auto;
  padding: 18px; display: grid; gap: 12px; border: 1px solid var(--line); }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 70; }
.toast { background: var(--surface); border: 1px solid var(--good); border-left: 5px solid var(--good); padding: 8px 12px; border-radius: 8px;
  box-shadow: var(--shadow); font-size: 14px; }
.case { border-left: 5px solid var(--warm); }

/* ── Modo Professor ── */
.prof { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; grid-template-rows: auto 1fr;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.prof-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.demos { display: flex; gap: 6px; overflow-x: auto; flex: 1 1 400px; min-width: 0; }
.demos button { flex: 0 0 auto; font-size: 14px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
.demos button[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.demos button .k { font-family: var(--font-mono); opacity: .7; margin-right: 4px; }
.demos button.opt { border-style: dashed; }
.clock { font-family: var(--font-mono); font-size: 15px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); display: flex; gap: 8px; align-items: center; }
.clock.late { border-color: var(--warm); color: var(--warm); }
.prof-main { display: grid; grid-template-columns: minmax(0, 1fr) min(430px, 38vw); gap: 12px; min-height: 0;
  padding: 12px max(12px, env(safe-area-inset-right, 0px)) 12px max(12px, env(safe-area-inset-left, 0px)); }
@media (max-width: 900px) { .prof-main { grid-template-columns: 1fr; overflow: auto; } }
.prof-stage { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: auto; }
.prof-stage > * { flex-shrink: 0; }
.prof-stage .stage { flex: 0 0 auto; }
.prof-stage .stage canvas { height: min(45vh, 560px); }
.prof-stage .charts { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.prof-stage .chart svg { max-height: 23vh; }
@media (max-width: 900px) { .prof-stage .stage canvas { height: 46vh; } .prof-side { overflow: visible; } }
.prof-side { display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 10px; overflow: auto; min-height: 0; min-width: 0; }
.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.steps span { text-align: center; font-size: 11px; font-weight: 700; padding: 6px 2px; border-radius: 6px; background: var(--surface-2);
  border: 1px solid var(--line); color: var(--muted); text-transform: uppercase; letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps span.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.steps span.done { color: var(--accent); border-color: var(--accent); }
.bigq { font-family: var(--font-display); font-size: clamp(20px, 2.2vw, 30px); font-weight: 700; line-height: 1.25; }
.prof .opts button { font-size: clamp(16px, 1.5vw, 21px); padding: 10px 14px; }
.prof .eq { font-size: clamp(20px, 2vw, 30px); }
.prof .results .row { font-size: clamp(15px, 1.4vw, 20px); }
.reveal { border: 2px solid var(--warm); border-radius: 10px; padding: 12px; display: grid; gap: 8px; background: var(--surface); }
.reveal .big { font-family: var(--font-mono); font-size: clamp(22px, 2.6vw, 36px); color: var(--warm); font-weight: 700; }
.prof-ctrls .ctrl label { font-size: 16px; } .prof-ctrls .ctrl output { font-size: 16px; }
.bigbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.bigbtns .btn { font-size: 17px; padding: 10px 14px; }
.kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); }
.roteiro table { width: 100%; border-collapse: collapse; font-size: 13px; }
.roteiro th, .roteiro td { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: top; }
.roteiro .wrap { overflow-x: auto; }
/* Projetor (1024×768, 1280×720…): palco menor e gráficos lado a lado, para caber sem rolar */
@media (max-height: 820px) {
  .prof-top { padding-block: 5px; gap: 6px; }
  .demos button { font-size: 13px; padding: 6px 9px; }
  .prof-stage .stage canvas { height: min(40vh, 420px); min-height: 240px; }
  .prof-stage .chart .ttl { font-size: 11px; }
  .prof-stage .charts { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .prof-stage .chart svg { max-height: 19vh; }
  .prof-stage .leitura { font-size: 14px; padding: 6px 10px; }
  .bigq { font-size: clamp(18px, 1.9vw, 26px); }
}

/* ── Camada didática ── */
.panel .body h3.sec { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 4px;
  padding-top: 10px; border-top: 1px solid var(--line); }
.leitura { font-size: 15px; line-height: 1.5; padding: 10px 12px; border-left: 4px solid var(--accent); background: var(--surface-2);
  border-radius: 0 8px 8px 0; display: grid; gap: 4px; min-height: 3em; }
.leitura .lbl { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.leitura .muted { color: var(--muted); font-size: 13px; }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.guide { border: 2px solid var(--accent); border-radius: 10px; padding: 12px; display: grid; gap: 8px; background: var(--surface); }
.guide .obj { margin: 0; font-size: 13px; color: var(--muted); }
.guide .ghead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.guide .pnum { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
.guide .dots { display: flex; gap: 4px; }
.guide .dots span { width: 18px; height: 6px; border-radius: 3px; background: var(--line); }
.guide .dots span.done { background: var(--accent); opacity: .45; } .guide .dots span.on { background: var(--accent); }
.guide .faca { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.35; }
.guide .obs, .guide .pense { margin: 0; font-size: 14px; }
.guide .pense { color: var(--muted); font-style: italic; }
.guide .concl { border-left: 4px solid var(--good); background: var(--surface-2); padding: 8px 10px; border-radius: 0 8px 8px 0; font-size: 14px; }
.guide .gnav { display: flex; gap: 6px; flex-wrap: wrap; }
.guide .gnav.end { justify-content: space-between; border-top: 1px dashed var(--line); padding-top: 8px; }
.contabox { display: grid; gap: 8px; }
.conta { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.conta li { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; display: grid; gap: 2px; min-width: 0; }
.conta .lbl { font-size: 12px; font-weight: 700; color: var(--muted); }
.conta .m { font-family: var(--font-eq); font-size: 17px; line-height: 1.4; overflow-wrap: anywhere; }
.conta .m b { font-family: var(--font-mono); font-size: 15px; }
.conta .nt { font-size: 12px; color: var(--muted); }
.simb { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.simb summary { cursor: pointer; font-weight: 700; font-size: 14px; }
.simb dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 8px 0 2px; font-size: 13px; }
.simb dt { font-family: var(--font-eq); font-weight: 700; font-size: 15px; } .simb dd { margin: 0; }
.prof .leitura { font-size: clamp(15px, 1.35vw, 19px); }
.prof .conta .m { font-size: clamp(16px, 1.5vw, 21px); }
.prof-side > * { min-width: 0; }

@media (prefers-reduced-motion: reduce) { .eq.flash { animation: none; } }

@media print {
  body * { visibility: hidden; }
  #printArea, #printArea * { visibility: visible; }
  #printArea { position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; }
  #printArea table { font-size: 11px; }
}

/* Revisão para demonstração presencial: fenômeno antes da matemática. */
.progressive {border-top:1px solid var(--line);padding:14px 0;min-width:0}
.progressive summary {cursor:pointer;font-size:16px;font-weight:650;padding:8px 0;color:var(--ink)}
.progressive[open] summary {margin-bottom:12px;color:var(--accent)}
.bench {grid-template-columns:minmax(0,1.55fr) minmax(340px,1fr);gap:24px}
.guide {border:0;background:var(--surface-2);padding:20px;gap:14px}
.guide .faca {font-size:21px;line-height:1.4}
.guide .obj {font-size:14px;line-height:1.5}
.guide .obs {font-size:16px;line-height:1.5}
.guide .gnav .btn {min-height:46px}
.guide .concl {font-size:16px;line-height:1.55}
.leitura {font-size:17px;line-height:1.55}
.stage canvas {min-height:360px}
@media(max-width:900px){.bench{grid-template-columns:1fr}.stage canvas{min-height:260px}.guide .faca{font-size:19px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><h1>Laboratório Virtual de Biofísica</h1><small>Transporte de solutos e solventes através da membrana · Ponto 4 · Prof. Dr. André Rinaldi Fukushima</small></div>
  <nav class="tabs" role="tablist" aria-label="Abas">
    <button role="tab" data-tab="explorar" aria-selected="true">Explorar</button>
    <button role="tab" data-tab="desafio" aria-selected="false">Desafio</button>
  </nav>
  <div class="top-actions">
    <button class="btn primary" id="profBtn" title="Atalho: P">Modo Professor</button>
    <button class="btn" id="caseBtn">Caso clínico surpresa</button>
    <button class="btn" id="helpBtn">Como usar</button>
    <button class="btn" id="fsBtn" aria-label="Tela cheia">⛶</button>
    <select id="themeSel" aria-label="Tema"><option value="system">Tema do sistema</option><option value="light">Claro</option><option value="dark">Escuro</option></select>
  </div>

  let m = v / Math.pow(10, e);

  if (s < 3 * 86400) return fmt(s / 3600, 1) + " h";

  l: {},

/** Canvas responsivo com devicePixelRatio. */

  return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const R0 = rng(2026);
function gauss(r = Math.random) { const u = 1 - r(), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

/* ── Conquistas (memória da sessão) ── */
const Achieve = {
  got: new Set(),
  give(key, label) {
    if (this.got.has(key)) return;
    this.got.add(key);
    toast("✓ " + label);
  },
};
function toast(msg, cls = "") {
  const t = h("div", { class: "toast " + cls, role: "status" }, msg);
  $("#toasts").append(t);
  setTimeout(() => t.remove(), 3800);
}

/* ── charts.js ── */
/* Gráficos SVG responsivos (cores pelos tokens; texto em tinta de texto, nunca na cor da série). */
"use strict";
const Chart = (() => {
  const NS = "http://www.w3.org/2000/svg";
  function niceTicks(a, b, n = 5) {
    const span = b - a || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => span / s <= n) || 10 * mag;
    const out = [];
    for (let v = Math.ceil(a / step) * step; v <= b + 1e-9 * span; v += step) out.push(+v.toFixed(10));
    return out;
  }
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

  /**
   * line({series:[{name, color, pts:[[x,y]], dash, width}], xlim, ylim, xlabel, ylabel, logy, logx,
   *       markers:[{x,y,label,color}], vlines:[{x,label}], hlines:[{y,label}], fills:[{pts, color, opacity}], fmtX, fmtY})
   */
  function line(host, o) {
    const W = 520, H = 300, m = { l: 62, r: 18, t: 16, b: 46 };
    const tx = o.logx ? (v) => Math.log10(v) : (v) => v, ty = o.logy ? (v) => Math.log10(Math.max(v, 1e-300)) : (v) => v;
    const [x0, x1] = o.xlim.map(tx), [y0, y1] = o.ylim.map(ty);
    const X = (v) => m.l + ((tx(v) - x0) / (x1 - x0)) * (W - m.l - m.r);
    const Y = (v) => H - m.b - ((ty(v) - y0) / (y1 - y0)) * (H - m.t - m.b);
    const fx = o.fmtX || ((v) => fmt(v, Math.abs(v) < 10 && v % 1 ? 1 : 0));
    const fy = o.fmtY || ((v) => fmt(v, Math.abs(v) < 10 && v % 1 ? 1 : 0));
    let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="${NS}" role="img" aria-label="${esc(o.aria || o.ylabel || "gráfico")}">`;
    const xt = o.logx ? range(Math.ceil(x0), Math.floor(x1)).map((e) => Math.pow(10, e)) : niceTicks(o.xlim[0], o.xlim[1], o.nx || 6);
    const yt = o.logy ? range(Math.ceil(y0), Math.floor(y1)).map((e) => Math.pow(10, e)) : niceTicks(o.ylim[0], o.ylim[1], o.ny || 5);
    for (const v of yt) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="12" fill="var(--muted)">${esc(o.logy ? sup10(v) : fy(v))}</text>`;
    for (const v of xt) s += `<text x="${X(v)}" y="${H - m.b + 18}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(o.logx ? sup10(v) : fx(v))}</text>`;
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="var(--muted)" stroke-width="1.2"/>`;
    s += `<text x="${(m.l + W - m.r) / 2}" y="${H - 6}" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">${esc(o.xlabel || "")}</text>`;
    s += `<text transform="translate(14 ${(m.t + H - m.b) / 2}) rotate(-90)" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">${esc(o.ylabel || "")}</text>`;
    s += `<clipPath id="cp${o.id || ""}"><rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}"/></clipPath><g clip-path="url(#cp${o.id || ""})">`;
    for (const f of o.fills || []) {
      s += `<path d="${f.pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join("")}Z" fill="${f.color}" fill-opacity="${f.opacity ?? 0.18}" stroke="none"/>`;
    }
    for (const v of o.vlines || []) s += `<line x1="${X(v.x)}" x2="${X(v.x)}" y1="${m.t}" y2="${H - m.b}" stroke="${v.color || "var(--muted)"}" stroke-dasharray="4 4" stroke-width="1.5"/>`;
    for (const v of o.hlines || []) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v.y)}" y2="${Y(v.y)}" stroke="${v.color || "var(--muted)"}" stroke-dasharray="4 4" stroke-width="1.5"/>`;
    for (const se of o.series) {
      const d = se.pts.filter((p) => isFinite(p[1])).map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join("");
      s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.width || 2.5}" stroke-linejoin="round" stroke-linecap="round" ${se.dash ? `stroke-dasharray="${se.dash}"` : ""}/>`;
    }
    s += `</g>`;
    for (const v of o.vlines || []) if (v.label) s += `<text x="${X(v.x) + 4}" y="${m.t + 12}" font-size="12" fill="var(--muted)">${esc(v.label)}</text>`;
    for (const mk of o.markers || []) {
      const cx = X(mk.x), cy = Y(mk.y);
      s += `<circle cx="${cx}" cy="${cy}" r="6" fill="${mk.color || "var(--warm)"}" stroke="var(--surface-2)" stroke-width="2"/>`;
      if (mk.label) {
        const right = cx < W - 150;
        s += `<text x="${cx + (right ? 10 : -10)}" y="${cy - 9}" text-anchor="${right ? "start" : "end"}" font-size="13" font-weight="700" fill="var(--ink)">${esc(mk.label)}</text>`;
      }
    }
    // legenda (≥2 séries)
    const named = o.series.filter((se) => se.name);
    if (named.length > 1) {
      let lx = m.l + 6;
      named.forEach((se) => {
        s += `<line x1="${lx}" x2="${lx + 16}" y1="${m.t + 4}" y2="${m.t + 4}" stroke="${se.color}" stroke-width="3" ${se.dash ? `stroke-dasharray="${se.dash}"` : ""}/>
              <text x="${lx + 20}" y="${m.t + 8}" font-size="12" fill="var(--ink)">${esc(se.name)}</text>`;
        lx += 30 + se.name.length * 6.4;
      });
    }
    s += `<rect class="hit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent"/></svg>`;
    host.innerHTML = s;
    // hover: crosshair + leitura da 1ª série
    if (o.hover !== false && o.series.length) attachHover(host, o, { W, H, m, X, Y, x0, x1, tx });
  }

  function attachHover(host, o, g) {
    const svg = host.querySelector("svg");
    let tip = host.querySelector(".tip");
    if (!tip) { tip = h("div", { class: "tip", hidden: true }); host.append(tip); }
    const cross = document.createElementNS(NS, "line");
    cross.setAttribute("stroke", "var(--muted)"); cross.setAttribute("stroke-width", "1"); cross.setAttribute("visibility", "hidden");
    svg.insertBefore(cross, svg.lastChild);
    svg.addEventListener("pointermove", (ev) => {
      const r = svg.getBoundingClientRect(), px = ((ev.clientX - r.left) / r.width) * g.W;
      if (px < g.m.l || px > g.W - g.m.r) { tip.hidden = true; cross.setAttribute("visibility", "hidden"); return; }
      const tv = g.x0 + ((px - g.m.l) / (g.W - g.m.l - g.m.r)) * (g.x1 - g.x0);
      const xv = o.logx ? Math.pow(10, tv) : tv;
      const parts = o.series.filter((se) => se.name || o.series.length === 1).map((se) => {
        let best = se.pts[0];
        for (const p of se.pts) if (Math.abs(p[0] - xv) < Math.abs(best[0] - xv)) best = p;
        return (se.name ? se.name + ": " : "") + (o.fmtTip ? o.fmtTip(best[1]) : fmtSci(best[1], 2));
      });
      tip.textContent = `${o.xlabel ? o.xlabel.split(" (")[0] : "x"} ${o.fmtTipX ? o.fmtTipX(xv) : fmtSci(xv, 2)} · ${parts.join(" · ")}`;
      tip.hidden = false;
      tip.style.left = ((px / g.W) * r.width) + "px"; tip.style.top = ((ev.clientY - r.top)) + "px";
      cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("y1", g.m.t); cross.setAttribute("y2", g.H - g.m.b);
      cross.setAttribute("visibility", "visible");
    });
    svg.addEventListener("pointerleave", () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); });
  }

  /** Barras verticais com valores (aceita negativos). bars:[{label, value, color}] */
  function bars(host, o) {
    const W = 520, H = 280, m = { l: 56, r: 14, t: 18, b: 44 };
    const vals = o.bars.map((b) => b.value);
    let lo = Math.min(0, ...vals, o.min ?? 0), hi = Math.max(0, ...vals, o.max ?? 0);
    const pad = (hi - lo) * 0.15 || 1; lo -= lo < 0 ? pad : 0; hi += hi > 0 ? pad : 0;
    const Y = (v) => m.t + ((hi - v) / (hi - lo)) * (H - m.t - m.b);
    const bw = (W - m.l - m.r) / o.bars.length;
    let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="${NS}" role="img" aria-label="${esc(o.aria || "barras")}">`;
    for (const v of niceTicks(lo, hi, 5)) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/>
      <text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="12" fill="var(--muted)">${fmt(v, 0)}</text>`;
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink)" stroke-width="1.4"/>`;
    o.bars.forEach((b, i) => {
      const x = m.l + i * bw + bw * 0.18, w = bw * 0.64, y = Math.min(Y(0), Y(b.value)), hh = Math.abs(Y(b.value) - Y(0));
      s += `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(1, hh)}" rx="4" fill="${b.color}"><title>${esc(b.label)}: ${fmt(b.value, 2)} ${o.unit || ""}</title></rect>`;
      const ly = b.value >= 0 ? y - 6 : y + hh + 15;
      s += `<text x="${x + w / 2}" y="${ly}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${fmt(b.value, o.dec ?? 1)}</text>`;
      s += `<text x="${x + w / 2}" y="${H - m.b + 18}" text-anchor="middle" font-size="12.5" fill="var(--ink)">${esc(b.label)}</text>`;
    });
    if (o.ylabel) s += `<text transform="translate(14 ${(m.t + H - m.b) / 2}) rotate(-90)" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">${esc(o.ylabel)}</text>`;
    s += `</svg>`;
    host.innerHTML = s;
  }

  function range(a, b) { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; }
  function sup10(v) {
    const e = Math.round(Math.log10(v));
    if (e === 0) return "1"; if (e === 1) return "10";
    return "10" + String(e).replace(/-/g, "⁻").replace(/\d/g, (c) => "⁰¹²³⁴⁵⁶⁷⁸⁹"[c]);
  }
  return { line, bars, niceTicks };
})();

/* ── sim.js ── */
/* Motor genérico de módulos: monta palco (canvas), gráficos, controles, resultados e equação a partir
   de uma definição declarativa. Usado tanto na aba Explorar quanto no Modo Professor. */
"use strict";
const Modules = {};
const ModOrder = [];
function defModule(def) { Modules[def.id] = def; ModOrder.push(def.id); }

/**
 * Monta uma instância de simulação.
 * els: {stage, charts, ctrls, results, eq, explain, actions, scenes}
 * opts: {scene, preset, controls: 'all' | [keys], big}
 */
function mountSim(def, els, opts = {}) {
  const S = {
    def, els, big: !!opts.big, scene: opts.scene || (def.scenes ? def.scenes[0].id : "main"),
    p: {}, t: 0, paused: false, chartsEls: [], dirty: true, chartTimer: 0, mem: {},
  };
  const inst = { S };

  function schema() { return def.params(S) || []; }
  function loadDefaults(preset) {
    S.p = {};
    for (const q of schema()) S.p[q.key] = q.value;
    Object.assign(S.p, def.presetFor ? def.presetFor(S.scene) : {}, preset || {});
  }

  function buildScenes() {
    if (!els.scenes) return;
    els.scenes.innerHTML = "";
    if (!def.scenes || def.scenes.length < 2) return;
    for (const sc of def.scenes) {
      els.scenes.append(h("button", {
        class: "btn", "aria-pressed": String(sc.id === S.scene),
        onclick: () => { inst.setScene(sc.id); },
      }, sc.label));
    }
  }

  function buildCtrls() {
    if (!els.ctrls) return;
    els.ctrls.innerHTML = "";
    S.ctrlDefs = [];
    const keys = opts.controls === "all" || !opts.controls ? null : opts.controls;
    for (const q of schema()) {
      if (keys && !keys.includes(q.key)) continue;
      if (q.hidden && !keys) continue;
      const id = `c_${def.id}_${q.key}_${Math.random().toString(36).slice(2, 7)}`;
      const out = h("output", { for: id });
      let input;
      if (q.options) {
        input = h("select", { id }, q.options.map(([v, l]) => h("option", { value: v }, l)));
        input.value = S.p[q.key];
        input.addEventListener("change", () => inst.set(q.key, isNaN(+input.value) ? input.value : +input.value));
        out.textContent = "";
        q._sync = () => { input.value = String(S.p[q.key]); };
      } else {
        const toSl = (v) => (q.log ? Math.log10(v) : v), fromSl = (v) => (q.log ? Math.pow(10, v) : v);
        input = h("input", { id, type: "range", min: toSl(q.min), max: toSl(q.max), step: q.log ? 0.01 : q.step || (q.max - q.min) / 200 });
        input.value = toSl(S.p[q.key]);
        input.addEventListener("input", () => inst.set(q.key, roundStep(fromSl(+input.value), q)));
        q._sync = () => { input.value = toSl(S.p[q.key]); out.textContent = showVal(q, S.p[q.key]); };
      }
      out.textContent = q.options ? "" : showVal(q, S.p[q.key]);
      q._out = out; q._in = input; S.ctrlDefs.push(q);
      els.ctrls.append(h("div", { class: "ctrl" }, h("label", { for: id }, q.label), out, input));
    }
  }
  function showVal(q, v) { return (q.fmt ? q.fmt(v) : (q.log ? fmtSci(v, 2) : fmt(v, q.dec ?? 1))) + (q.unit ? " " + q.unit : ""); }
  function roundStep(v, q) { if (q.log || !q.step) return v; return Math.round(v / q.step) * q.step; }

  function buildActions() {
    if (!els.actions) return;
    els.actions.innerHTML = "";
    const acts = def.actions ? def.actions(S, inst) : [];
    for (const a of acts) {
      if (opts.actionsFilter && !opts.actionsFilter.includes(a.id)) continue;
      els.actions.append(h("button", { class: "btn" + (a.primary ? " primary" : ""), onclick: () => { a.fn(); inst.refresh(); } }, a.label));
    }
  }

  function buildCharts() {
    if (!els.charts) return;
    els.charts.innerHTML = "";
    S.chartsEls = (def.chartTitles ? def.chartTitles(S) : []).map((t) => {
      const box = h("div", { class: "chart" }, h("div", { class: "ttl" }, t), h("div", { class: "cbody" }));
      els.charts.append(box);
      return box.querySelector(".cbody");
    });
  }

  inst.refresh = function (light) {
    for (const q of S.ctrlDefs || []) if (q._sync) q._sync();
    if (els.results && def.results) {
      els.results.innerHTML = "";
      for (const r of def.results(S)) {
        els.results.append(h("div", { class: "row" + (r.hl ? " hl" : "") }, h("span", {}, r.k), h("span", {}, r.v)));
      }
    }
    if (els.eq && def.equation) els.eq.innerHTML = def.equation(S);
    if (!light && def.charts && S.chartsEls.length) def.charts(S, S.chartsEls);
    if (!light) buildActions();
    if (els.explain && def.explain && !light) renderExplain(els.explain, def.explain(S), def.note && def.note(S));
    if (els.conta && def.conta && !light) renderConta(els.conta, def.conta(S), def.simbolos && def.simbolos(S));
    updLeitura();
    if (!light) for (const f of inst.hooks) f();
  };
  inst.hooks = [];
  function updLeitura() {
    if (!els.leitura || !def.leitura) return;
    const html = `<span class="lbl">O que está acontecendo agora</span><div>${def.leitura(S)}</div>`;
    if (html !== S._leit) { S._leit = html; els.leitura.innerHTML = html; }
  }

  inst.set = function (k, v, silent) {
    S.p[k] = v;
    def.onParam && def.onParam(S, k, inst);
    if (!silent) inst.refresh();
  };
  inst.setMany = function (o) { for (const [k, v] of Object.entries(o)) { S.p[k] = v; def.onParam && def.onParam(S, k, inst); } inst.refresh(); };
  inst.setScene = function (sc, preset) {
    S.scene = sc;
    loadDefaults(preset);
    buildScenes(); buildCtrls(); buildActions(); buildCharts();
    def.init && def.init(S, inst);
    inst.refresh();
  };
  inst.reset = function (preset) { inst.setScene(S.scene, preset || opts.preset); };
  inst.destroy = function () { Ticker.remove(inst); S.cv && S.cv.destroy(); };
  inst.step = function (dt) {
    S.t += dt;
    def.step && def.step(S, dt, inst);
    S.chartTimer += dt;
    S.leitTimer = (S.leitTimer || 0) + dt;
    if (S.leitTimer > 0.4) { S.leitTimer = 0; updLeitura(); }
    if (def.liveCharts && S.chartsEls.length && S.chartTimer > 0.35) { S.chartTimer = 0; def.charts(S, S.chartsEls); inst.refresh(true); }
  };
  inst.draw = function () { if (S.cv) { S.cv.ctx.clearRect(0, 0, S.cv.w, S.cv.h); def.draw && def.draw(S, S.cv.ctx, S.cv.w, S.cv.h); } };
  Object.defineProperty(inst, "paused", { get: () => S.paused });

  if (els.stage) { S.cv = makeCanvas(els.stage, def.title); }
  S.scene = opts.scene || S.scene;
  loadDefaults(opts.preset);
  buildScenes(); buildCtrls(); buildActions(); buildCharts();
  def.init && def.init(S, inst);
  inst.refresh();
  Ticker.add(inst);
  Bus.on("theme", () => inst.refresh());
  return inst;
}

/* ── A conta passo a passo: itens [título, expressão HTML, cor da série (opcional), nota (opcional)] ── */
function renderConta(host, itens, simbolos) {
  host.innerHTML = "";
  if (!itens || !itens.length) return;
  const ol = h("ol", { class: "conta" });
  for (const [t, m, cor, nota] of itens) {
    ol.append(h("li", {}, h("span", { class: "lbl" }, cor ? h("i", { class: "sw", style: `background:${cor}` }) : null, t),
      h("div", { class: "m", html: m }), nota ? h("div", { class: "nt", html: nota }) : null));
  }
  host.append(ol);
  if (simbolos && simbolos.length) {
    host.append(h("details", { class: "simb" }, h("summary", {}, "O que significa cada letra?"),
      h("dl", {}, simbolos.flatMap(([s, d]) => [h("dt", { html: s }), h("dd", { html: d })]))));
  }
}

/* ── Roteiro guiado: passos {faca, acao(inst), observe, conclusao} por cena ── */
function buildGuide(host, def, inst) {
  let scene = null, i = 0, shown = false;
  const box = h("div", { class: "guide" });
  host.append(box);
  function steps() { const g = def.guia; if (!g) return []; return g[inst.S.scene] || g.main || []; }
  function render() {
    const st = steps();
    box.innerHTML = "";
    if (!st.length) { box.hidden = true; return; }
    box.hidden = false;
    const p = st[i];
    const obj = def.objetivo ? (typeof def.objetivo === "function" ? def.objetivo(inst.S) : def.objetivo) : "";
    if (obj) box.append(h("p", { class: "obj" }, h("b", {}, "Objetivo: "), obj));
    const dots = h("div", { class: "dots", "aria-hidden": "true" }, st.map((_, k) => h("span", { class: k < i ? "done" : k === i ? "on" : "" })));
    box.append(h("div", { class: "ghead" }, h("span", { class: "pnum" }, `Passo ${i + 1} de ${st.length}`), dots));
    box.append(h("p", { class: "faca", html: p.faca }));
    if (p.observe) box.append(h("p", { class: "obs", html: "<b>Observe:</b> " + p.observe }));
    const concl = h("div", { class: "concl", html: "<b>O que concluir:</b> " + p.conclusao, hidden: !shown });
    const pense = h("p", { class: "pense", hidden: shown }, p.acao ? "Antes de clicar, faça a sua previsão: o que vai mudar?" : "Pense na resposta antes de abrir a conclusão.");
    const btns = h("div", { class: "gnav" });
    if (p.acao) btns.append(h("button", { class: "btn primary", onclick: () => { p.acao(inst); inst.refresh(); flashEq(); shown = false; concl.hidden = true; pense.hidden = false; pense.textContent = "Observe a mudança na animação. Quando estiver pronto, revele a explicação."; } }, "▶ Executar esta alteração"));
    btns.append(h("button", { class: "btn", onclick: () => { shown = !shown; concl.hidden = !shown; pense.hidden = shown; } }, "Revelar a explicação"));
    box.append(pense, btns, concl);
    box.append(h("div", { class: "gnav end" },
      h("button", { class: "btn ghost", disabled: i === 0, onclick: () => { i--; shown = false; render(); } }, "← Passo anterior"),
      h("button", { class: "btn", disabled: i === st.length - 1, onclick: () => { i++; shown = false; render(); } }, "Próximo passo →")));
  }
  inst.hooks.push(() => { if (inst.S.scene !== scene) { scene = inst.S.scene; i = 0; shown = false; render(); } });
  scene = inst.S.scene; render();
}

function renderExplain(host, ex, note) {
  host.innerHTML = "";
  if (!ex) return;
  const blocks = [["O que aconteceu?", ex.que], ["Por que aconteceu?", ex.porque], ["Por que isso importa?", ex.importa]];
  blocks.forEach(([t, txt], i) => {
    if (!txt) return;
    host.append(h("details", { open: i === 0 ? true : null }, h("summary", {}, t), h("p", { html: txt })));
  });
  if (note) host.append(h("p", { class: "note", html: "Hipóteses do modelo: " + note }));
}

/* ── Layout da aba Explorar para um módulo ── */
function buildExplore(host, def) {
  host.innerHTML = "";
  const scenes = h("div", { class: "scenes", role: "group", "aria-label": "Cenas" });
  const stage = h("div", { class: "stage" });
  const badge = h("div", { class: "badge" }, "Animação didática — veja as hipóteses do modelo");
  stage.append(badge);
  const charts = h("div", { class: "charts" });
  const runbar = h("div", { class: "runbar" });
  const leitura = h("div", { class: "leitura", "aria-live": "polite" });
  const guide = h("div");
  const conta = h("div", { class: "contabox" });
  const ctrls = h("div", { class: "ctrls" });
  const actions = h("div", { class: "actions" });
  const results = h("div", { class: "results", "aria-live": "polite" });
  const eq = h("div", { class: "eq" });
  const explain = h("div", { class: "explain" });
  const bet = h("div");
  const cmpHost = h("div");

  const left = h("section", { class: "panel" },
    h("header", {}, h("h2", {}, `${def.num}. ${def.title}`), scenes),
    h("div", { class: "body" }, stage, leitura, runbar,
      h("details", { class: "progressive" }, h("summary", {}, "Ver os gráficos e comparar cenários"), charts, cmpHost)));
  const right = h("aside", { class: "panel" },
    h("header", {}, h("h2", {}, "Roteiro guiado")),
    h("div", { class: "body" }, guide,
      h("details", { class: "progressive", id: "mathPanel" }, h("summary", {}, "Entender a fórmula e ver a conta"), eq, conta),
      h("details", { class: "progressive" }, h("summary", {}, "Investigar com os controles"), ctrls, actions, results),
      h("details", { class: "progressive" }, h("summary", {}, "Testar minha compreensão"), bet, explain)));
  host.append(h("div", { class: "bench" }, left, right));

  const inst = mountSim(def, { stage, charts, ctrls, results, eq, explain, actions, scenes, leitura, conta }, { controls: "all" });
  buildGuide(guide, def, inst);
  stage.append(badge);
  buildRunbar(runbar, inst, def);
  buildBet(bet, def, inst);
  if (def.compare) buildCompareToggle(runbar, cmpHost, def);
  return inst;
}

function buildRunbar(bar, inst) {
  const play = h("button", { class: "btn", "aria-label": "Pausar ou executar" }, "⏸ Pausar");
  play.onclick = () => { inst.S.paused = !inst.S.paused; play.textContent = inst.S.paused ? "▶ Executar" : "⏸ Pausar"; };
  const reset = h("button", { class: "btn", onclick: () => inst.reset() }, "↺ Reiniciar");
  const sp = h("select", { "aria-label": "Velocidade", id: "spd_" + inst.S.def.id },
    [["0.5", "0,5×"], ["1", "1×"], ["2", "2×"], ["4", "4×"]].map(([v, l]) => h("option", { value: v }, l)));
  sp.value = String(Ticker.speed);
  sp.onchange = () => { Ticker.speed = +sp.value; };
  bar.append(play, reset, h("span", { class: "speed" }, "Velocidade", sp));
}

/* ── "Aposte no resultado" / "O que acontece se...?" ── */
function buildBet(host, def, inst) {
  const bets = def.bets || [];
  if (!bets.length) return;
  let i = 0;
  const box = h("div", { class: "bet" });
  host.append(box);
  function show() {
    const b = bets[i];
    box.innerHTML = "";
    let choice = null;
    const opts = h("div", { class: "opts" });
    const verdict = h("div", { class: "verdict", "aria-live": "polite" });
    const apply = h("button", { class: "btn warm", disabled: true }, b.applyLabel || "Aplicar a alteração e observar");
    b.opts.forEach((o, k) => {
      const bt = h("button", { "aria-pressed": "false" }, `${"ABCD"[k]}. ${o}`);
      bt.onclick = () => { choice = k; $$("button", opts).forEach((x) => x.setAttribute("aria-pressed", "false")); bt.setAttribute("aria-pressed", "true"); apply.disabled = false; };
      opts.append(bt);
    });
    apply.onclick = () => {
      if (b.scene && inst.S.scene !== b.scene) inst.setScene(b.scene);
      b.apply(inst.S, inst); inst.refresh();
      const ok = choice === b.correct;
      $$("button", opts).forEach((x, k) => { if (k === b.correct) x.classList.add("right"); else if (k === choice) x.classList.add("wrong"); });
      verdict.className = "verdict " + (ok ? "ok" : "no");
      verdict.innerHTML = (ok ? "Previsão correta. " : "Não era essa. ") + b.why;
      apply.disabled = true;
      if (def.achievement) Achieve.give(def.id, def.achievement);
    };
    const nav = h("div", { class: "actions" },
      h("button", { class: "btn ghost", onclick: () => { i = (i + 1) % bets.length; inst.reset(); show(); } }, "Outro desafio →"));
    box.append(h("h3", {}, "Aposte no resultado"), h("div", { class: "q" }, b.q), opts, apply, verdict, nav);
  }
  show();
}

/* ── Comparação lado a lado ── */
function buildCompareToggle(bar, host, def) {
  const sel = h("select", { "aria-label": "Comparar cenários", id: "cmp_" + def.id },
    h("option", { value: "" }, "Comparar lado a lado…"), def.compare.map((c, k) => h("option", { value: k }, c.name)));
  bar.append(sel);
  let insts = [];
  sel.onchange = () => {
    insts.forEach((x) => x.destroy()); insts = [];
    host.innerHTML = "";
    if (sel.value === "") return;
    const c = def.compare[+sel.value];
    const wrap = h("div", { class: "compare" });
    host.append(wrap);
    for (const side of [c.a, c.b]) {
      const stage = h("div", { class: "stage" }), results = h("div", { class: "results" });
      wrap.append(h("div", { class: "panel" }, h("header", {}, h("h2", {}, side.label)), h("div", { class: "body" }, stage, results)));
      insts.push(mountSim(def, { stage, results }, { scene: side.scene, preset: side.p }));
    }
  };
}

/* ── modules1.js ── */
/* Módulos 1–3: potencial eletroquímico, difusão/permeabilidade, proteínas de transporte. */
"use strict";

const IONS = {
  Na: { z: 1, Ce: 145, Ci: 12, label: "Na⁺" },
  K: { z: 1, Ce: 4.5, Ci: 140, label: "K⁺" },
  Ca: { z: 2, Ce: 1.2, Ci: 0.0001, label: "Ca²⁺" },
  Cl: { z: -1, Ce: 110, Ci: 10, label: "Cl⁻" },
};
const ionLabel = (S) => IONS[S.p.ion].label;

/* ════════════════ MÓDULO 1 — POTENCIAL ELETROQUÍMICO ════════════════ */
defModule({
  id: "eletro", num: 1, title: "Membrana e potencial eletroquímico", short: "Potencial eletroquímico",
  achievement: "Gradiente eletroquímico compreendido",
  params: () => [
    { key: "ion", label: "Íon", options: [["Na", "Na⁺"], ["K", "K⁺"], ["Ca", "Ca²⁺"], ["Cl", "Cl⁻"]], value: "Na" },
    { key: "Ce", label: "[íon] fora (Cₑ)", min: 0.0001, max: 200, log: true, value: 145, unit: "mM" },
    { key: "Ci", label: "[íon] dentro (Cᵢ)", min: 0.0001, max: 200, log: true, value: 12, unit: "mM" },
    { key: "Vm", label: "Potencial de membrana Vm (ψᵢ − ψₑ)", min: -120, max: 80, step: 1, value: -70, unit: "mV", dec: 0 },
    { key: "T", label: "Temperatura", min: 20, max: 42, step: 0.5, value: 37, unit: "°C" },
    { key: "canal", label: "Via de passagem (canal)", options: [["1", "Canal aberto"], ["0", "Sem canal (só bicamada)"]], value: 1 },
  ],
  onParam(S, k, inst) {
    if (k === "ion") { const I = IONS[S.p.ion]; S.p.Ce = I.Ce; S.p.Ci = I.Ci; }
  },
  init(S) {
    const r = rng(11);
    S.parts = Array.from({ length: 70 }, (_, i) => ({ x: r(), y: r(), side: i < 40 ? "e" : "i", fly: null }));
    S.nin = 0; S.nout = 0; S.acc = 0;
  },
  calc(S) { const I = IONS[S.p.ion]; return Phys.deltaG(I.z, S.p.Ce, S.p.Ci, S.p.Vm, S.p.T); },
  step(S, dt) {
    const g = this.calc(S), I = IONS[S.p.ion];
    // número de partículas visíveis de cada lado: escala logarítmica ilustrativa
    const want = (c) => Math.round(clamp(6 + 9 * Math.log10(c / 0.0001) / 1.2, 3, 45));
    const ne = want(S.p.Ce), ni = want(S.p.Ci);
    let ce = S.parts.filter((p) => p.side === "e"), ci = S.parts.filter((p) => p.side === "i");
    if (ce.length > ne) ce.slice(ne).forEach((p) => (p.dead = 1));
    if (ci.length > ni) ci.slice(ni).forEach((p) => (p.dead = 1));
    S.parts = S.parts.filter((p) => !p.dead);
    for (let k = ce.length; k < ne; k++) S.parts.push({ x: Math.random(), y: Math.random(), side: "e" });
    for (let k = ci.length; k < ni; k++) S.parts.push({ x: Math.random(), y: Math.random(), side: "i" });
    for (const p of S.parts) {
      if (p.fly) { p.fly.t += dt / 0.9; if (p.fly.t >= 1) { p.side = p.fly.to; p.y = p.fly.to === "i" ? 0.05 : 0.95; p.x = 0.5 + (Math.random() - 0.5) * 0.1; p.fly = null; } continue; }
      p.x = clamp(p.x + gauss() * 0.02, 0.02, 0.98); p.y = clamp(p.y + gauss() * 0.02, 0.02, 0.98);
    }
    if (+S.p.canal !== 1) return;
    // eventos de travessia com razão de Ussing: J_in/J_out = exp(−ΔG/RT)
    const phi = (Phys.F * S.p.Vm / 1000) / (g.rt * 1000);
    let lin = S.p.Ce * Math.exp(-I.z * phi / 2), lout = S.p.Ci * Math.exp(I.z * phi / 2);
    const sc = 2.2 / Math.max(lin, lout);
    lin *= sc; lout *= sc;
    if (Math.random() < lin * dt) this.launch(S, "e", "i");
    if (Math.random() < lout * dt) this.launch(S, "i", "e");
  },
  launch(S, from, to) {
    const c = S.parts.filter((p) => p.side === from && !p.fly);
    if (!c.length) return;
    c.sort((a, b) => Math.abs(a.x - 0.5) - Math.abs(b.x - 0.5));
    c[0].fly = { t: 0, to };
    if (to === "i") S.nin++; else S.nout++;
  },
  draw(S, ctx, w, hh) {
    const c = Theme.c, ym = hh / 2, th = Math.min(46, hh * 0.13), g = this.calc(S), open = +S.p.canal === 1;
    Draw.bg(ctx, w, hh, c.ecf, c.icf, ym);
    // área das partículas à esquerda; painel de forças à direita
    const pw = Math.min(230, Math.max(130, w * 0.24)), nar = pw < 165, aw = w - pw - 16, cx = aw / 2;
    const gx0 = cx - 22, gx1 = cx + 22;
    Draw.membrane(ctx, 0, w, ym, th, [{ x0: gx0 - 6, x1: gx1 + 6 }]);
    Draw.rrect(ctx, gx0 - 8, ym - th / 2 - 6, 16, th + 12, 6, c.muted);
    Draw.rrect(ctx, gx1 - 8, ym - th / 2 - 6, 16, th + 12, 6, c.muted);
    if (!open) Draw.rrect(ctx, gx0 + 6, ym - 5, gx1 - gx0 - 12, 10, 4, c.bad);
    Draw.text(ctx, "MEIO EXTRACELULAR (fora)", 12, 22, { color: c.muted, size: 12 });
    Draw.text(ctx, "CITOSOL (dentro)", 12, hh - 12, { color: c.muted, size: 12 });
    Draw.text(ctx, open ? "canal aberto" : "sem via (canal fechado)", cx, ym - th / 2 - 12, { align: "center", size: 12, color: open ? c.muted : c.bad, weight: 700 });
    // cargas de superfície ilustrando Vm
    const n = Math.round(Math.abs(S.p.Vm) / 15);
    for (let k = 0; k < n; k++) {
      const x = 30 + (k * (aw - 60)) / Math.max(1, n - 1);
      if (Math.abs(x - cx) < 40) continue;
      const top = S.p.Vm < 0 ? "+" : "−", bot = S.p.Vm < 0 ? "−" : "+";
      Draw.text(ctx, top, x, ym - th / 2 - 8, { align: "center", size: 15, color: c.muted });
      Draw.text(ctx, bot, x, ym + th / 2 + 18, { align: "center", size: 15, color: c.muted });
    }
    const lbl = ionLabel(S), r = this.big ? 10 : 8;
    for (const p of S.parts) {
      let x, y;
      if (p.fly) {
        x = cx; const from = p.fly.to === "i" ? ym - th : ym + th, to = p.fly.to === "i" ? ym + th : ym - th;
        y = lerp(from, to, p.fly.t);
      } else {
        x = 12 + p.x * (aw - 24);
        y = p.side === "e" ? 34 + p.y * (ym - th / 2 - 54) : ym + th / 2 + 24 + p.y * (hh - ym - th / 2 - 50);
      }
      Draw.dot(ctx, x, y, r, c.s1, lbl.length < 3 ? lbl[0] : "", "#fff");
    }
    Draw.text(ctx, `contador: ${S.nin} entraram · ${S.nout} saíram`, aw - 8, 22, { align: "right", size: 12, color: c.ink });
    if (!open) Draw.text(ctx, "ΔG pode ser favorável, mas sem via o fluxo é ≈ 0", cx, hh - 30, { align: "center", size: 13, color: c.bad, weight: 700 });
    // painel de forças: seta para baixo = empurra para DENTRO (termo negativo)
    const px = w - pw - 8, py = 8, ph = hh - 16;
    ctx.globalAlpha = 0.92; Draw.rrect(ctx, px, py, pw, ph, 10, c.surface, c.line); ctx.globalAlpha = 1;
    Draw.text(ctx, "FORÇAS SOBRE O ÍON", px + pw / 2, py + 18, { align: "center", size: 11, color: c.muted, weight: 700 });
    Draw.text(ctx, nar ? "↓ dentro · ↑ fora" : "↓ para dentro  ·  ↑ para fora", px + pw / 2, py + 34, { align: "center", size: 11, color: c.muted });
    const terms = [[nar ? "quím." : "química", g.chem, c.s3], [nar ? "elétr." : "elétrica", g.elec, c.s4], [nar ? "ΔG" : "ΔG total", g.total, c.s2]];
    const half = Math.max(30, ph / 2 - 62), colW = pw / 3;
    ctx.strokeStyle = c.line; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(px + 6, ym); ctx.lineTo(px + pw - 6, ym); ctx.stroke(); ctx.setLineDash([]);
    terms.forEach(([nome, v, col], k) => {
      const x = px + colW * (k + 0.5), len = clamp(Math.abs(v) / 14, 0, 1) * half;
      if (Math.abs(v) < 0.15 || len < 8) Draw.text(ctx, "≈ 0", x, ym + 5, { align: "center", size: 14, weight: 700, color: c.ink });
      else { const dn = v < 0; Draw.arrow(ctx, x, dn ? ym - len : ym + len, x, dn ? ym + len : ym - len, col, k === 2 ? 7 : 5); }
      Draw.text(ctx, nome, x, py + ph - 26, { align: "center", size: 12, weight: 700, color: c.ink });
      Draw.text(ctx, (v > 0 ? "+" : "") + fmt(v, 1), x, py + ph - 10, { align: "center", size: 12, color: c.ink });
    });
    Draw.text(ctx, "kJ/mol", px + pw - 8, py + ph - 42, { align: "right", size: 10, color: c.muted });
  },
  chartTitles: () => ["Contribuições para ΔG (kJ/mol)", "ΔG em função de Vm"],
  charts(S, [a, b]) {
    const g = this.calc(S), I = IONS[S.p.ion];
    Chart.bars(a, { bars: [{ label: "químico", value: g.chem, color: "var(--s3)" }, { label: "elétrico", value: g.elec, color: "var(--s4)" },
      { label: "ΔG total", value: g.total, color: "var(--s2)" }], unit: "kJ/mol", ylabel: "kJ/mol", aria: "Termos de ΔG" });
    const pts = []; for (let v = -120; v <= 80; v += 2) pts.push([v, Phys.deltaG(I.z, S.p.Ce, S.p.Ci, v, S.p.T).total]);
    const ys = pts.map((p) => p[1]);
    Chart.line(b, { id: "e1", series: [{ name: "", color: "var(--s2)", pts }], xlim: [-120, 80], ylim: [Math.min(...ys, -1), Math.max(...ys, 1)],
      xlabel: "Vm (mV)", ylabel: "ΔG entrada (kJ/mol)", hlines: [{ y: 0 }],
      vlines: isFinite(g.Eeq) && g.Eeq > -120 && g.Eeq < 80 ? [{ x: g.Eeq, label: "E_eq" }] : [],
      markers: [{ x: S.p.Vm, y: g.total, label: fmt(g.total, 1) + " kJ/mol" }], fmtTip: (v) => fmt(v, 1) + " kJ/mol", fmtTipX: (v) => fmt(v, 0) + " mV" });
  },
  results(S) {
    const g = this.calc(S);
    return [
      { k: "Termo químico RT·ln(Cᵢ/Cₑ)", v: fmt(g.chem, 2) + " kJ/mol" },
      { k: "Termo elétrico z·F·Vm", v: fmt(g.elec, 2) + " kJ/mol" },
      { k: "ΔG para entrar", v: fmt(g.total, 2) + " kJ/mol", hl: true },
      { k: "Potencial de equilíbrio (Nernst)", v: fmt(g.Eeq, 1) + " mV" },
      { k: "Razão J_entrada / J_saída (Ussing)", v: fmtSci(Phys.fluxRatio(g.total, S.p.T), 2) },
      { k: "Sentido espontâneo", v: Math.abs(g.total) < 0.3 ? "≈ equilíbrio" : g.total < 0 ? "entrada" : "saída" },
    ];
  },
  equation: (S) => `ΔG = RT·ln(C<sub>i</sub>/C<sub>e</sub>) + z·F·V<sub>m</sub><small>convenção: movimento de fora para dentro · V<sub>m</sub> = ψ<sub>i</sub> − ψ<sub>e</sub> · ΔG &lt; 0 → entrada espontânea</small>`,
  explain(S) {
    const g = this.calc(S), L = ionLabel(S);
    return {
      que: `Com estes valores, mover 1 mol de ${L} para dentro tem ΔG = <b>${fmt(g.total, 1)} kJ/mol</b>: ${g.total < 0 ? "a entrada é espontânea" : "a tendência é de saída"}. O fluxo líquido aparece só se houver um canal aberto.`,
      porque: "O termo químico depende da razão de concentrações; o termo elétrico, da carga do íon e do potencial de membrana. Somados, dão o gradiente eletroquímico. Quando ΔG = 0, o íon está no seu potencial de Nernst.",
      importa: "O gradiente de Na⁺ é a 'bateria' da célula: move o potencial de ação e alimenta o transporte ativo secundário. A favorabilidade termodinâmica não basta: sem proteína de transporte, íons praticamente não atravessam a bicamada.",
    };
  },
  note: () => "concentrações mantidas constantes (compartimentos grandes); partículas desenhadas em escala logarítmica de concentração; os eventos de travessia obedecem à razão de fluxos de Ussing, J_in/J_out = exp(−ΔG/RT).",
  bets: [
    { q: "Se o interior celular ficar mais positivo (Vm = +40 mV), o Na⁺ continuará com a mesma tendência de entrar?",
      opts: ["Sim, a mesma tendência", "Ainda entra, mas com tendência menor", "Passa a sair da célula"], correct: 1,
      apply: (S, i) => i.setMany({ ion: "Na", Ce: 145, Ci: 12, Vm: 40 }),
      why: "Com Vm = +40 mV o termo elétrico fica positivo (+3,9 kJ/mol), mas o termo químico (−6,4) ainda vence: ΔG ≈ −2,6 kJ/mol." },
    { q: "Se fecharmos o canal, mantendo o ΔG do Na⁺ em −13 kJ/mol, o que acontece com o fluxo?",
      opts: ["Continua igual", "Cai praticamente a zero", "Inverte o sentido"], correct: 1,
      apply: (S, i) => i.setMany({ ion: "Na", Ce: 145, Ci: 12, Vm: -70, canal: 0 }),
      why: "ΔG diz o sentido possível; a velocidade depende de uma via. A bicamada é quase impermeável a íons." },
    { q: "Para o K⁺ (140 mM dentro, 4,5 mM fora) com Vm = −70 mV, qual a tendência?",
      opts: ["Entrar fortemente", "Sair, mas perto do equilíbrio", "Equilíbrio exato"], correct: 1,
      apply: (S, i) => i.setMany({ ion: "K", Ce: 4.5, Ci: 140, Vm: -70, canal: 1 }),
      why: "ΔG de entrada ≈ +2,1 kJ/mol: o K⁺ tende a sair, mas está perto do seu E_K ≈ −92 mV." },
  ],
  compare: [
    { name: "Canal aberto × sem canal", a: { label: "Canal aberto", p: { canal: 1 } }, b: { label: "Sem canal", p: { canal: 0 } } },
    { name: "Vm −70 mV × +40 mV (Na⁺)", a: { label: "Vm = −70 mV", p: { Vm: -70 } }, b: { label: "Vm = +40 mV", p: { Vm: 40 } } },
  ],
});

/* ════════════════ MÓDULO 2 — DIFUSÃO E PERMEABILIDADE ════════════════ */
defModule({
  id: "difusao", num: 2, title: "Difusão e permeabilidade", short: "Difusão",
  achievement: "Lei de Fick aplicada",
  scenes: [{ id: "escala", label: "Tempo × distância" }, { id: "membrana", label: "Fick e permeabilidade" }],
  params: (S) => S.scene === "escala" ? [
    { key: "D", label: "Coeficiente de difusão D", min: 1e-7, max: 1e-4, log: true, value: 1e-5, unit: "cm²/s" },
    { key: "x", label: "Distância x", min: 1e-6, max: 10, log: true, value: 1e-3, unit: "", fmt: fmtLen },
  ] : [

/* ════════════════ MÓDULO 3 — PROTEÍNAS DE TRANSPORTE ════════════════ */
const PUMP_STAGES = [

/* ── modules2.js ── */
/* Módulos 4–7: osmose/tonicidade, Starling, pH e aprisionamento iônico, célula de difusão. */
"use strict";

/* ════════════════ MÓDULO 4 — OSMOSE E TONICIDADE ════════════════ */
const SOLUCOES = {
  nacl: { label: "NaCl 0,9 % (≈ 300 mOsm/L, impermeante)", curto: "NaCl 0,9 %", imp: 300, perm: 0 },
  hiper: { label: "NaCl 1,35 % — hipertônica (450 mOsm/L)", curto: "Hipertônica", imp: 450, perm: 0 },
  hipo: { label: "NaCl 0,45 % — hipotônica (150 mOsm/L)", curto: "Hipotônica", imp: 150, perm: 0 },
  agua: { label: "Água pura (0 mOsm/L)", curto: "Água pura", imp: 0, perm: 0 },
  ureia: { label: "Ureia 300 mM (isosmótica, permeante)", curto: "Ureia 300 mM", imp: 0, perm: 300 },
  glicose: { label: "Glicose 5 % (≈ 280 mOsm/L, antes de metabolizada)", curto: "Glicose 5 %", imp: 280, perm: 0 },
};
/* Hemácia: b = volume não osmótico (≈ 0,4·V0); LISE = volume crítico (forma esférica) da célula "típica". */
const B_RBC = 0.4, LISE = 1.65;
const RBC_PRM = { nImp: 300 * (1 - B_RBC), b: B_RBC };
const rbcOsm = (S) => Phys.rbcOsmIn(S.cell, RBC_PRM);
/* Teste de fragilidade osmótica: volume crítico de lise distribuído na população (modelo didático). */
const FRAG = {
  normal: { mu: 1.69, sd: 0.085, label: "Hemácias normais" },
  esfero: { mu: 1.30, sd: 0.10, label: "Esferocitose hereditária" },
};
const naclOsm = (pct) => 300 * pct / 0.9;                       // NaCl % → mOsm/L (0,9 % ≈ 300)
const fragV = (pct) => Phys.rbcVeq(naclOsm(pct), B_RBC);
const fragHem = (pct, pop) => 100 * Phys.normCdf((fragV(pct) - FRAG[pop].mu) / FRAG[pop].sd);
const fmtPct = (v) => fmt(v, 2).replace(/0$/, "");
/* Desenho do teste de fragilidade: 60 hemácias da amostra + tubo com sobrenadante avermelhado pela hemoglobina liberada. */
const FRAG_N = 60;
const FRAG_Q = (() => { const r = rng(11), idx = Array.from({ length: FRAG_N }, (_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx.map((i) => Phys.probit((i + 0.5) / FRAG_N)); })();
function drawFragil(S, ctx, w, hh, c) {
  const pct = S.p.nacl, pop = FRAG[S.p.pop], V = fragV(pct), hem = fragHem(pct, S.p.pop) / 100;
  ctx.fillStyle = c.stage; ctx.fillRect(0, 0, w, hh);
  const tubeW = Math.min(120, w * 0.16), gridW = w - tubeW - 70, cols = 10, rows = FRAG_N / cols;
  const cw = gridW / cols, ch = (hh - 80) / rows, R = Math.min(cw, ch) * 0.27;
  Draw.text(ctx, `${pop.label} · NaCl ${fmtPct(pct)} % (≈ ${fmt(naclOsm(pct), 0)} mOsm/L)`, 14, 24, { size: 15, weight: 700 });
  Draw.text(ctx, `hemólise: ${fmt(hem * 100, 0)} %`, gridW + 10, 24, { size: 15, weight: 700, align: "right", color: c.bad });
  let k = 0;
  for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++, k++) {
    const cx = 20 + cw * (q + 0.5), cy = 50 + ch * (r + 0.5), vc = pop.mu + pop.sd * FRAG_Q[k], lysed = V >= vc;
    const vv = Math.min(V, vc), sx = R * Math.pow(vv, 0.5), sy = R * 0.62 * Math.pow(vv, 0.5) * (vv > 1.2 ? 1 + (vv - 1.2) * 0.9 : 1);
    if (lysed) {
      ctx.strokeStyle = "#c0392b"; ctx.globalAlpha = 0.45; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.ellipse(cx, cy, sx, Math.min(sy, sx), 0, 0, 7); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = "#c0392b"; ctx.beginPath();
      if (vv < 0.85) { for (let a = 0; a <= 6.3; a += 0.08) { const rr = 1 + 0.12 * Math.sin(12 * a); ctx.lineTo(cx + Math.cos(a) * sx * rr, cy + Math.sin(a) * sy * rr); } }
      else ctx.ellipse(cx, cy, sx, Math.min(sy, sx), 0, 0, 7);
      ctx.fill();
      if (vv < 1.2) { ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(cx, cy, sx * 0.45, sy * 0.4, 0, 0, 7); ctx.fill(); }
    }
  }
  // tubo de ensaio: sobrenadante fica vermelho com a hemoglobina liberada; o sedimento é a fração intacta
  const tx = w - tubeW - 30, ty = 50, th = hh - 90;
  ctx.fillStyle = `rgba(192,57,43,${(0.06 + 0.8 * hem).toFixed(3)})`; ctx.fillRect(tx, ty + 20, tubeW, th - 20);
  const pel = (1 - hem) * th * 0.28;
  ctx.fillStyle = "#8e2a20"; ctx.beginPath(); ctx.ellipse(tx + tubeW / 2, ty + th - pel / 2, tubeW / 2, Math.max(pel / 2, 1), 0, 0, 7); ctx.fill();
  ctx.strokeStyle = c.muted; ctx.lineWidth = 2; ctx.strokeRect(tx, ty, tubeW, th);
  Draw.text(ctx, "tubo após", tx + tubeW / 2, ty + th + 18, { align: "center", size: 12, color: c.muted });
  Draw.text(ctx, "centrifugar", tx + tubeW / 2, ty + th + 32, { align: "center", size: 12, color: c.muted });
  Draw.legend(ctx, [["#c0392b", "hemácia íntegra"], [c.muted, "tracejada = rompida (hemólise)"]], gridW / 2 + 20, hh - 10, gridW);
}

defModule({
  id: "osmose", num: 4, title: "Osmose e tonicidade", short: "Osmose",
  achievement: "Tonicidade diferenciada",
  scenes: [{ id: "hemacia", label: "Hemácia" }, { id: "fragil", label: "Fragilidade osmótica" }, { id: "tubo", label: "Tubo em U (van 't Hoff)" }],
  params: (S) => S.scene === "fragil" ? [
    { key: "nacl", label: "NaCl no tubo", min: 0, max: 1, step: 0.05, value: 0.9, unit: "%", dec: 2 },
    { key: "pop", label: "Amostra de sangue", options: [["normal", "Hemácias normais"], ["esfero", "Esferocitose hereditária"]], value: "normal" },
  ] : S.scene === "hemacia" ? [
    { key: "sol", label: "Solução externa", options: Object.entries(SOLUCOES).map(([k, v]) => [k, v.label]), value: "nacl" },
    { key: "imp", label: "Soluto impermeante (σ ≈ 1)", min: 0, max: 600, step: 10, value: 300, unit: "mOsm/L", dec: 0 },
    { key: "perm", label: "Soluto permeante (ex.: ureia, σ ≈ 0)", min: 0, max: 600, step: 10, value: 0, unit: "mOsm/L", dec: 0 },
    { key: "aqp", label: "Permeabilidade à água", options: [["1", "Com aquaporinas"], ["0", "Sem aquaporinas (lenta)"]], value: 1 },
  ] : [
    { key: "c1", label: "Lado esquerdo", min: 0, max: 600, step: 10, value: 100, unit: "mOsm/L", dec: 0 },
    { key: "c2", label: "Lado direito", min: 0, max: 600, step: 10, value: 300, unit: "mOsm/L", dec: 0 },
    { key: "T", label: "Temperatura", min: 0, max: 42, step: 1, value: 37, unit: "°C", dec: 0 },
  ],
  onParam(S, k) { if (k === "sol") { const s = SOLUCOES[S.p.sol]; S.p.imp = s.imp; S.p.perm = s.perm; this.init(S); } },
  init(S) { S.cell = { V: 1, s: 0 }; S.hist = [[0, 1]]; S.tt = 0; S.lysed = false; S.level = 0; },
  step(S, dt) {
    if (S.scene === "fragil") { S.tt += dt; return; }
    if (S.scene === "tubo") { const target = clamp((S.p.c2 - S.p.c1) / 400, -1, 1); S.level += (target - S.level) * dt * 0.8; return; }
    if (S.lysed) return;
    const prm = { ...RBC_PRM, Lp: +S.p.aqp ? 2.2 : 0.25, Ps: 0.35 };
    for (let k = 0; k < 4; k++) S.cell = Phys.rbcStep(S.cell, { imp: S.p.imp, perm: S.p.perm }, dt / 4, prm);
    S.tt += dt;
    if (S.cell.V >= LISE) { S.cell.V = LISE; S.lysed = true; Achieve.give("osmose", "Tonicidade diferenciada"); }
    if (S.hist.length < 2 || S.tt - S.hist[S.hist.length - 1][0] > 0.15) S.hist.push([S.tt, S.cell.V]);
    if (S.hist.length > 400) S.hist.shift();
  },
  liveCharts: true,
  draw(S, ctx, w, hh) {
    const c = Theme.c;
    ctx.fillStyle = c.ecf; ctx.fillRect(0, 0, w, hh);
    if (S.scene === "fragil") { drawFragil(S, ctx, w, hh, c); return; }
    if (S.scene === "tubo") {
      const base = hh - 40, colW = Math.min(170, w * 0.28), gx = w / 2;
      const lx = gx - colW - 30, rx = gx + 30, lvl = S.level * 80;
      ctx.fillStyle = c.stage; ctx.fillRect(0, 0, w, hh);
      Draw.rrect(ctx, lx, 60 + 80 + lvl, colW, base - 60 - 80 - lvl, 4, c.ecf, c.line);
      Draw.rrect(ctx, rx, 60 + 80 - lvl, colW, base - 60 - 80 + lvl, 4, c.ecf, c.line);
      ctx.fillStyle = c.ecf; ctx.fillRect(lx + colW, base - 40, rx - lx - colW, 30);
      ctx.setLineDash([5, 4]); ctx.strokeStyle = c.muted; ctx.beginPath(); ctx.moveTo(gx, base - 42); ctx.lineTo(gx, base - 8); ctx.stroke(); ctx.setLineDash([]);
      const r2 = rng(9);
      for (let k = 0; k < Math.round(S.p.c1 / 15); k++) Draw.dot(ctx, lx + 10 + r2() * (colW - 20), base - 20 - r2() * (base - 170 - lvl), 4, c.s2);
      for (let k = 0; k < Math.round(S.p.c2 / 15); k++) Draw.dot(ctx, rx + 10 + r2() * (colW - 20), base - 20 - r2() * (base - 170 + lvl), 4, c.s2);
      const d = S.p.c2 - S.p.c1;
      if (Math.abs(d) > 5) Draw.arrow(ctx, gx - (d > 0 ? 40 : -40), base - 25, gx + (d > 0 ? 40 : -40), base - 25, c.s1, 4);
      Draw.text(ctx, "membrana semipermeável (passa só água)", gx, base + 16, { align: "center", size: 12, color: c.muted });
      Draw.text(ctx, `${fmt(S.p.c1, 0)} mOsm/L`, lx + colW / 2, 40, { align: "center", size: 15, weight: 700 });
      Draw.text(ctx, `${fmt(S.p.c2, 0)} mOsm/L`, rx + colW / 2, 40, { align: "center", size: 15, weight: 700 });
      return;
    }
    // hemácia
    const cx = w / 2, cy = hh / 2, R = Math.min(w, hh) * 0.2;
    const r2 = rng(4);
    for (let k = 0; k < Math.round(S.p.imp / 12); k++) Draw.dot(ctx, r2() * w, r2() * hh, 3.5, c.s1);
    for (let k = 0; k < Math.round(S.p.perm / 12); k++) { const a = r2() * 7, rr = R * (1.6 + r2() * 1.5); Draw.dot(ctx, cx + Math.cos(a + S.tt * 0.2) * rr, cy + Math.sin(a + S.tt * 0.2) * rr * 0.7, 3.5, c.s2); }
    const V = S.cell.V, sx = R * Math.pow(V, 0.5), sy = R * 0.62 * Math.pow(V, 0.5) * (V > 1.3 ? 1 + (V - 1.3) : 1);
    if (S.lysed) {
      ctx.globalAlpha = 0.3; ctx.fillStyle = "#c0392b"; ctx.beginPath(); ctx.ellipse(cx, cy, sx * 1.4, sy * 1.4, 0, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = "#c0392b"; ctx.lineWidth = 3; ctx.setLineDash([10, 9]); ctx.beginPath(); ctx.ellipse(cx, cy, sx, sy, 0, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      Draw.text(ctx, "HEMÓLISE", cx, cy + 6, { align: "center", size: 22, weight: 800, color: c.bad });
    } else {
      ctx.fillStyle = "#c0392b"; ctx.beginPath();
      if (V < 0.85) { for (let a = 0; a <= 6.3; a += 0.05) { const rr = 1 + 0.1 * Math.sin(12 * a) * (0.85 - V) * 4; ctx.lineTo(cx + Math.cos(a) * sx * rr, cy + Math.sin(a) * sy * rr); } }
      else ctx.ellipse(cx, cy, sx, sy, 0, 0, 7);
      ctx.fill();
      if (V < 1.25) { ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(cx, cy, sx * 0.45, sy * 0.4, 0, 0, 7); ctx.fill(); }
      const sn = Math.round(S.cell.s / Math.max(V - B_RBC, 0.05) / 25);
      for (let k = 0; k < sn; k++) Draw.dot(ctx, cx + (r2() - 0.5) * sx * 1.2, cy + (r2() - 0.5) * sy * 1.2, 3, c.s2);
    }
    const osmIn = rbcOsm(S), osmOut = S.p.imp + S.p.perm, dir = osmIn - osmOut;
    if (!S.lysed && Math.abs(dir) > 3) for (const a of [0, 1.6, 3.2, 4.7]) {
      const ox = cx + Math.cos(a) * (sx + 50), oy = cy + Math.sin(a) * (sy + 40), ix = cx + Math.cos(a) * (sx + 8), iy = cy + Math.sin(a) * (sy + 6);
      dir > 0 ? Draw.arrow(ctx, ox, oy, ix, iy, c.s1, 3) : Draw.arrow(ctx, ix, iy, ox, oy, c.s1, 3);
    }
    Draw.text(ctx, `volume relativo: ${fmt(V, 2)}`, 12, 22, { size: 15, weight: 700 });
    Draw.text(ctx, dir > 3 ? "água ENTRA" : dir < -3 ? "água SAI" : "fluxo de água ≈ 0", w - 12, 22, { size: 14, weight: 700, align: "right", color: c.s1 });
    Draw.legend(ctx, [[c.s1, "soluto impermeante (não entra)"], [c.s2, "soluto permeante (entra)"]], w / 2, hh - 12, w - 20);
  },
  chartTitles: (S) => S.scene === "fragil" ? ["Curva de fragilidade osmótica (% de hemólise × NaCl)", "Volume de equilíbrio × NaCl (Boyle–van 't Hoff)"]
    : S.scene === "hemacia" ? ["Volume da hemácia × tempo", "Osmolaridade × tonicidade (mOsm/L)"] : ["Pressão osmótica (mmHg)"],
  charts(S, els) {
    if (S.scene === "fragil") {
      const xs = []; for (let x = 0.2; x <= 1.0001; x += 0.01) xs.push(+x.toFixed(2));
